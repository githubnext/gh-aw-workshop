<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Fork the repository">
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#161b22"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">github.com/your-org/your-repo</text>
  <!-- Traffic lights -->
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>

  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="74" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff" font-weight="bold">Code</text>
  <rect x="30" y="88" width="32" height="3" fill="#58a6ff" rx="2"/>
  <text x="90" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Issues</text>
  <text x="168" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Pull requests</text>
  <text x="309" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Actions</text>
  <text x="396" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Settings</text>

  <!-- Fork modal -->
  <rect x="300" y="110" width="600" height="380" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="155" font-family="Arial,sans-serif" font-size="20" font-weight="bold" fill="#c9d1d9" text-anchor="middle">Create a new fork</text>
  <line x1="300" y1="170" x2="900" y2="170" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="205" font-family="Arial,sans-serif" font-size="13" fill="#8b949e">Owner</text>
  <rect x="330" y="215" width="250" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="345" y="237" font-family="Arial,sans-serif" font-size="13" fill="#c9d1d9">your-username</text>
  <text x="600" y="233" font-family="Arial,sans-serif" font-size="16" fill="#8b949e" text-anchor="middle">/</text>
  <text x="620" y="205" font-family="Arial,sans-serif" font-size="13" fill="#8b949e">Repository name</text>
  <rect x="620" y="215" width="250" height="34" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="635" y="237" font-family="Arial,sans-serif" font-size="13" fill="#c9d1d9">gh-aw-workshop</text>
  <text x="330" y="285" font-family="Arial,sans-serif" font-size="13" fill="#8b949e">Description (optional)</text>
  <rect x="330" y="295" width="540" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="330" y="365" font-family="Arial,sans-serif" font-size="13" fill="#c9d1d9">☑  Copy the main branch only</text>
  <rect x="330" y="415" width="200" height="36" rx="6" fill="#58a6ff"/>
  <text x="430" y="438" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#161b22" text-anchor="middle">Create fork</text>
  <text x="600" y="540" font-family="Arial,sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Fork the repository</text>

</svg>