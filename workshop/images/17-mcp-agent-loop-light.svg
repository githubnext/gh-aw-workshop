<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="MCP agent loop: task brief enters the agent, which reasons and makes tool calls to GitHub via MCP, receives results, and produces final output"
  data-visual-kind="diagram"
  data-visual-id="17-mcp-agent-loop">

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#101411">MCP Agent Loop</text>
  <text x="600" y="68" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" fill="#232925">How the agent uses MCP tool calls to fetch live data and produce output</text>

  <!-- === Node 1: Task Brief === -->
  <!-- Box -->
  <rect x="40" y="206" width="176" height="100" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="2" data-node="task-brief"/>
  <!-- Step badge -->
  <circle cx="40" cy="206" r="14" fill="#08872b"/>
  <text x="40" y="211" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f2f5f3">1</text>
  <!-- Icon: clock octicon path (simplified) -->
  <g transform="translate(110,226)" aria-hidden="true">
    <circle cx="0" cy="0" r="12" fill="none" stroke="#08872b" stroke-width="2"/>
    <line x1="0" y1="-7" x2="0" y2="0" stroke="#08872b" stroke-width="2"/>
    <line x1="0" y1="0" x2="5" y2="3" stroke="#08872b" stroke-width="2"/>
  </g>
  <text x="128" y="262" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#101411">Task Brief</text>
  <text x="128" y="280" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">Scheduled trigger</text>
  <text x="128" y="296" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">+ workflow brief</text>

  <!-- Arrow 1→2 -->
  <line x1="216" y1="256" x2="275" y2="256" stroke="#232925" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- === Node 2: Agent Reasoning === -->
  <rect x="276" y="190" width="196" height="132" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="2" data-node="agent-reasoning"/>
  <circle cx="276" cy="190" r="14" fill="#08872b"/>
  <text x="276" y="195" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f2f5f3">2</text>
  <!-- Robot-like icon for agent -->
  <g transform="translate(374,215)" aria-hidden="true">
    <rect x="-14" y="-10" width="28" height="22" rx="4" fill="none" stroke="#08872b" stroke-width="2"/>
    <circle cx="-5" cy="-2" r="3" fill="#08872b"/>
    <circle cx="5" cy="-2" r="3" fill="#08872b"/>
    <line x1="-5" y1="6" x2="5" y2="6" stroke="#08872b" stroke-width="2"/>
    <line x1="0" y1="-10" x2="0" y2="-15" stroke="#08872b" stroke-width="2"/>
  </g>
  <text x="374" y="252" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#101411">Agent Reasoning</text>
  <text x="374" y="272" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">Reads brief, decides</text>
  <text x="374" y="290" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">which tools to call</text>
  <text x="374" y="308" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-style="italic" fill="#232925">Copilot model</text>

  <!-- Arrow 2→3 (down to MCP Gateway) -->
  <line x1="374" y1="322" x2="374" y2="378" stroke="#232925" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="389" y="358" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#232925">tool call</text>

  <!-- === Node 3: MCP Gateway === -->
  <!-- Region box for MCP area -->
  <rect x="260" y="384" width="504" height="96" rx="10" fill="#e4ebe6" stroke="#b6bfb8" stroke-width="2" data-node="mcp-gateway"/>
  <text x="512" y="408" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#101411">MCP Gateway</text>
  <text x="512" y="428" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">gh-proxy routes tool calls through</text>
  <text x="512" y="446" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">GITHUB_TOKEN — no extra credentials needed</text>
  <text x="512" y="464" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#232925">mode: gh-proxy · toolsets: [default]</text>

  <!-- Arrow MCP→GitHub (right) -->
  <line x1="764" y1="432" x2="830" y2="432" stroke="#232925" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- Arrow 3 to MCP Gateway: horizontal from 2 area to MCP box -->
  <line x1="512" y1="322" x2="512" y2="384" stroke="#b6bfb8" stroke-width="1.5" stroke-dasharray="6 4" aria-hidden="true"/>

  <!-- === Node 4: GitHub API === -->
  <rect x="832" y="382" width="180" height="100" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="2" data-node="github-api"/>
  <!-- Octicon: git-pull-request (simplified) for GitHub entity -->
  <g transform="translate(922,413)" aria-hidden="true">
    <circle cx="-12" cy="-4" r="5" fill="none" stroke="#1a7f37" stroke-width="2" data-state="open"/>
    <circle cx="12" cy="-4" r="5" fill="none" stroke="#1a7f37" stroke-width="2" data-state="open"/>
    <line x1="-12" y1="1" x2="-12" y2="14" stroke="#1a7f37" stroke-width="2"/>
    <path d="M-12,14 Q0,22 12,14" fill="none" stroke="#1a7f37" stroke-width="2"/>
  </g>
  <text x="922" y="444" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#101411">GitHub API</text>
  <text x="922" y="462" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">Issues, commits,</text>
  <text x="922" y="478" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">repository data</text>

  <!-- Arrow GitHub→Results (up) -->
  <line x1="922" y1="382" x2="922" y2="330" stroke="#08872b" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="932" y="362" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#232925">results</text>

  <!-- === Node 5: Results feed back to agent === -->
  <!-- Arrow from results area back to agent -->
  <line x1="922" y1="256" x2="922" y2="256" stroke="#08872b" stroke-width="2" aria-hidden="true"/>
  <!-- connecting line from API return point to agent -->
  <polyline points="922,330 922,256 472,256" fill="none" stroke="#08872b" stroke-width="2.5" marker-end="url(#arrow-green)" stroke-dasharray="8 4"/>
  <text x="740" y="244" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#08872b">live data returned to agent</text>

  <!-- === Node 6: Output === -->
  <rect x="956" y="190" width="200" height="132" rx="10" fill="#ffffff" stroke="#1a7f37" stroke-width="2.5" data-node="output"/>
  <circle cx="956" cy="190" r="14" fill="#08872b"/>
  <text x="956" y="195" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f2f5f3">3</text>
  <!-- Octicon: issue-opened -->
  <g transform="translate(1056,218)" aria-hidden="true">
    <circle cx="0" cy="0" r="11" fill="none" stroke="#1a7f37" stroke-width="2" data-state="open"/>
    <circle cx="0" cy="0" r="4" fill="#1a7f37" data-state="open"/>
  </g>
  <text x="1056" y="252" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#101411">Output</text>
  <text x="1056" y="272" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">Agent writes daily</text>
  <text x="1056" y="290" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#232925">status summary</text>
  <text x="1056" y="308" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#1a7f37" data-state="open">posted as new Issue</text>

  <!-- Arrow from Agent→Output -->
  <line x1="472" y1="224" x2="955" y2="224" stroke="#08872b" stroke-width="2.5" stroke-dasharray="8 4" marker-end="url(#arrow-green)"/>
  <text x="714" y="216" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#08872b">final output (after tool calls)</text>

  <!-- Bottom annotation -->
  <text x="600" y="520" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#232925">The agent loops through reasoning and tool calls until it has all needed data, then produces its final output via safe-outputs.</text>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="arrow-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232925"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#08872b"/>
    </marker>
  </defs>
</svg>
