<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Local setup flow: four sequential steps to set up your local terminal — Verify Git, Install gh CLI, Authenticate, Clone Repo">

  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="54" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Local Terminal Setup Flow</text>

  <!-- Step connectors (arrows) -->
  <!-- Step 1 → Step 2 -->
  <line x1="310" y1="280" x2="376" y2="280" stroke="#30363d" stroke-width="3"/>
  <polygon points="376,274 390,280 376,286" fill="#30363d"/>
  <!-- Step 2 → Step 3 -->
  <line x1="570" y1="280" x2="636" y2="280" stroke="#30363d" stroke-width="3"/>
  <polygon points="636,274 650,280 636,286" fill="#30363d"/>
  <!-- Step 3 → Step 4 -->
  <line x1="830" y1="280" x2="896" y2="280" stroke="#30363d" stroke-width="3"/>
  <polygon points="896,274 910,280 896,286" fill="#30363d"/>

  <!-- Step 1: Verify Git -->
  <rect x="70" y="200" width="240" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="70" cy="200" r="18" fill="#2f81f7"/>
  <text x="70" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f0f6fc" text-anchor="middle">1</text>
  <rect x="95" y="215" width="190" height="50" rx="8" fill="#0d1117"/>
  <text x="190" y="247" font-family="monospace" font-size="14" fill="#f0f6fc" text-anchor="middle">git --version</text>
  <text x="190" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Verify Git</text>
  <text x="190" y="318" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Confirm Git is installed</text>
  <text x="190" y="337" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">and version 2.x+</text>

  <!-- Step 2: Install gh CLI -->
  <rect x="330" y="200" width="240" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="330" cy="200" r="18" fill="#2f81f7"/>
  <text x="330" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f0f6fc" text-anchor="middle">2</text>
  <rect x="355" y="215" width="190" height="50" rx="8" fill="#0d1117"/>
  <text x="450" y="247" font-family="monospace" font-size="14" fill="#f0f6fc" text-anchor="middle">gh --version</text>
  <text x="450" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Install gh CLI</text>
  <text x="450" y="318" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Install GitHub CLI via</text>
  <text x="450" y="337" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">brew, winget, or apt</text>

  <!-- Step 3: Authenticate -->
  <rect x="590" y="200" width="240" height="160" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="590" cy="200" r="18" fill="#2f81f7"/>
  <text x="590" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#f0f6fc" text-anchor="middle">3</text>
  <rect x="615" y="215" width="190" height="50" rx="8" fill="#0d1117"/>
  <text x="710" y="247" font-family="monospace" font-size="14" fill="#f0f6fc" text-anchor="middle">gh auth login</text>
  <text x="710" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Authenticate</text>
  <text x="710" y="318" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Log in to GitHub.com</text>
  <text x="710" y="337" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">via browser one-time code</text>

  <!-- Step 4: Clone Repo -->
  <rect x="850" y="200" width="280" height="160" rx="12" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <circle cx="850" cy="200" r="18" fill="#3fb950"/>
  <text x="850" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0d1117" text-anchor="middle">4</text>
  <rect x="875" y="215" width="230" height="50" rx="8" fill="#0d1117"/>
  <text x="990" y="247" font-family="monospace" font-size="13" fill="#f0f6fc" text-anchor="middle">gh repo clone my-aw</text>
  <text x="990" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Clone Repo</text>
  <text x="990" y="318" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Clone your practice repo</text>
  <text x="990" y="337" font-family="Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">and open in terminal</text>

  <!-- Done chip -->
  <rect x="900" y="388" width="180" height="36" rx="18" fill="#12261e" stroke="#3fb950" stroke-width="1.5"/>
  <text x="990" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#3fb950" text-anchor="middle">✓ Ready to continue</text>

  <!-- Annotation -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="middle">Complete all four steps in order before continuing to the core workshop.</text>

</svg>
