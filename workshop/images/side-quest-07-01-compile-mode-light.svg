<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Decision diagram: after editing a workflow source file, choose gh aw compile mode: use --no-emit for a quick structure check with no lock file written, plain compile for a normal edit that updates the lock file, --validate for a slower schema and deprecation audit, or --watch for continuous recompiling while iterating." data-visual-kind="diagram" data-visual-id="side-quest-07-01-compile-mode-light">
<rect width="1200" height="560" fill="#f2f5f3"/>
<rect x="24" y="20" width="1152" height="520" rx="12" ry="12" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
<text x="600" y="56" text-anchor="middle" font-family="Mona Sans, system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#101411">Choosing Your gh aw compile Mode</text>
<text x="600" y="80" text-anchor="middle" font-family="Mona Sans, system-ui, -apple-system, sans-serif" font-size="13" fill="#232925">Pick the command that matches what you need right now</text>
<rect x="420" y="100" width="360" height="56" rx="28" fill="#08872b" data-node="start"/>
<text x="600" y="133" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="14" font-weight="700" fill="#101411">You edit a workflow .md file</text>
<line x1="600" y1="156" x2="600" y2="196" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<polygon points="600,198 760,258 600,318 440,258" fill="#e4ebe6" stroke="#08872b" stroke-width="2" data-node="decision"/>
<text x="600" y="252" text-anchor="middle" font-family="Mona Sans, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#101411">What do you need</text>
<text x="600" y="270" text-anchor="middle" font-family="Mona Sans, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#101411">right now?</text>
<line x1="440" y1="258" x2="204" y2="298" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<circle cx="322.0" cy="279.0" r="12" fill="#08872b"/>
<text x="322.0" y="283.0" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#101411">1</text>
<rect x="84" y="300" width="240" height="140" rx="10" ry="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="mode-1"/>
<text x="204" y="332" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="15" font-weight="700" fill="#08872b">--no-emit</text>
<text x="204" y="356" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">Quick structure check</text>
<text x="204" y="376" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">after a small edit</text>
<line x1="204" y1="440" x2="204" y2="462" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<rect x="84" y="464" width="240" height="34" rx="17" ry="17" fill="#e4ebe6" stroke="#08872b" stroke-width="1.5"/>
<text x="204" y="486" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#101411">No lock file written</text>
<line x1="600" y1="318" x2="468" y2="298" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<circle cx="534.0" cy="309.0" r="12" fill="#08872b"/>
<text x="534.0" y="313.0" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#101411">2</text>
<rect x="348" y="300" width="240" height="140" rx="10" ry="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="mode-2"/>
<text x="468" y="332" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="15" font-weight="700" fill="#08872b">compile</text>
<text x="468" y="356" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">Normal edit, ready</text>
<text x="468" y="376" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">to test the workflow</text>
<line x1="468" y1="440" x2="468" y2="462" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<rect x="348" y="464" width="240" height="34" rx="17" ry="17" fill="#e4ebe6" stroke="#08872b" stroke-width="1.5"/>
<text x="468" y="486" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#101411">Lock file updated</text>
<line x1="600" y1="318" x2="732" y2="298" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<circle cx="666.0" cy="309.0" r="12" fill="#08872b"/>
<text x="666.0" y="313.0" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#101411">3</text>
<rect x="612" y="300" width="240" height="140" rx="10" ry="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="mode-3"/>
<text x="732" y="332" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="15" font-weight="700" fill="#08872b">--validate</text>
<text x="732" y="356" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">Targeted schema and</text>
<text x="732" y="376" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">deprecation audit</text>
<line x1="732" y1="440" x2="732" y2="462" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<rect x="612" y="464" width="240" height="34" rx="17" ry="17" fill="#e4ebe6" stroke="#08872b" stroke-width="1.5"/>
<text x="732" y="486" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#101411">Lock file + full audit</text>
<line x1="760" y1="258" x2="996" y2="298" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<circle cx="878.0" cy="279.0" r="12" fill="#08872b"/>
<text x="878.0" y="283.0" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="700" fill="#101411">4</text>
<rect x="876" y="300" width="240" height="140" rx="10" ry="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="mode-4"/>
<text x="996" y="332" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="15" font-weight="700" fill="#08872b">--watch</text>
<text x="996" y="356" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">Iterating by hand,</text>
<text x="996" y="376" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#101411">want live feedback</text>
<line x1="996" y1="440" x2="996" y2="462" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
<rect x="876" y="464" width="240" height="34" rx="17" ry="17" fill="#e4ebe6" stroke="#08872b" stroke-width="1.5"/>
<text x="996" y="486" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" font-weight="600" fill="#101411">Recompiles on every save</text>
<text x="600" y="524" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#232925">Numbered arrows show the read order: start at the top, follow the branch that matches your moment.</text>
<defs><marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#232925"/></marker></defs>
</svg>