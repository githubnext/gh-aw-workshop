<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Agentic workflow architecture: at compile time, gh aw compile converts a .md workflow into a .lock.yml; at runtime, a trigger fires GitHub Actions, which executes the .lock.yml and calls an AI model to produce safe outputs" data-visual-kind="diagram" data-visual-id="agentic-workflow-architecture">
  <!-- Icons: Primer Octicons, MIT License, Copyright GitHub, Inc. -->
  <!-- Background -->
  <rect width="1200" height="580" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Agentic Workflow Architecture</text>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">What you built: how a gh-aw workflow runs end to end</text>

  <!-- ──────────────── Compile-time zone ──────────────── -->
  <text x="310" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">compile time</text>
  <rect x="43" y="80" width="597" height="106" rx="6" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Node A: .md workflow -->
  <rect x="60" y="90" width="140" height="70" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="90" width="140" height="28" rx="8" fill="#1c2d4a"/>
  <rect x="60" y="108" width="140" height="10" fill="#1c2d4a"/>
  <text x="130" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79c0ff">.md workflow</text>
  <text x="130" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">your workflow</text>
  <text x="130" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">definition</text>

  <!-- Arrow A to B -->
  <line x1="200" y1="125" x2="258" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Node B: gh aw compile (the compiler CLI — runs at author time, not in GitHub Actions) -->
  <rect x="258" y="90" width="175" height="70" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <rect x="258" y="90" width="175" height="28" rx="8" fill="#1c2d4a"/>
  <rect x="258" y="108" width="175" height="10" fill="#1c2d4a"/>
  <text x="345" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#79c0ff">gh aw compile</text>
  <text x="345" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">compiles .md</text>
  <text x="345" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">into .lock.yml</text>

  <!-- Arrow B to C -->
  <line x1="433" y1="125" x2="494" y2="125" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Node C: .lock.yml (compiled artifact committed to the repository) -->
  <rect x="494" y="90" width="132" height="70" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <rect x="494" y="90" width="132" height="28" rx="8" fill="#1a2e22"/>
  <rect x="494" y="108" width="132" height="10" fill="#1a2e22"/>
  <text x="560" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#3fb950">.lock.yml</text>
  <text x="560" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">compiled workflow</text>
  <text x="560" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">committed to repo</text>

  <!-- Connector: .lock.yml feeds into GitHub Actions at runtime -->
  <path d="M 560 160 L 560 200 L 425 200 L 425 222" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-green-dark)"/>

  <!-- ──────────────── Runtime zone ──────────────── -->
  <text x="558" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">your practice repository workflow run</text>
  <rect x="43" y="210" width="1030" height="248" rx="6" fill="none" stroke="#30363d" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Node 1: Trigger -->
  <g data-node="trigger">
  <rect x="60" y="222" width="195" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="222" width="195" height="36" rx="10" fill="#121d2f"/>
  <rect x="60" y="240" width="195" height="18" fill="#121d2f"/>
  <text x="157" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#79c0ff">Trigger</text>
  <text x="157" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">on: schedule</text>
  <text x="157" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">workflow_dispatch</text>
  <rect x="91" y="311" width="132" height="26" rx="13" fill="#121d2f" stroke="#2f81f7" stroke-width="1"/>
  <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z" fill="#79c0ff" transform="translate(103 318) scale(.7)"/>
  <text x="165" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">Daily schedule</text>
  <rect x="91" y="345" width="132" height="26" rx="13" fill="#121d2f" stroke="#2f81f7" stroke-width="1"/>
  <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm4.879-2.773 4.264 2.559a.25.25 0 0 1 0 .428l-4.264 2.559A.25.25 0 0 1 6 10.559V5.442a.25.25 0 0 1 .379-.215Z" fill="#79c0ff" transform="translate(102 351) scale(.75)"/>
  <text x="165" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#79c0ff">Manual run</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="255" y1="312" x2="310" y2="312" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Step 1 -->
  <circle cx="282" cy="300" r="11" fill="#2f81f7"/>
  <text x="282" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">1</text>

  <!-- Node 2: GitHub Actions (executes the compiled .lock.yml directly) -->
  <g data-node="github-actions">
  <rect x="310" y="222" width="230" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="310" y="222" width="230" height="36" rx="10" fill="#272115"/>
  <rect x="310" y="240" width="230" height="18" fill="#272115"/>
  <path d="M0 1.75C0 .784.784 0 1.75 0h3.5C6.216 0 7 .784 7 1.75v3.5A1.75 1.75 0 0 1 5.25 7H4v4a1 1 0 0 0 1 1h4v-1.25C9 9.784 9.784 9 10.75 9h3.5c.966 0 1.75.784 1.75 1.75v3.5A1.75 1.75 0 0 1 14.25 16h-3.5A1.75 1.75 0 0 1 9 14.25v-.75H5A2.5 2.5 0 0 1 2.5 11V7h-.75A1.75 1.75 0 0 1 0 5.25Zm1.75-.25a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Zm9 9a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Z" fill="#e3b341" transform="translate(366 234) scale(.75)"/>
  <text x="435" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e3b341">GitHub Actions</text>
  <text x="425" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Runs the job</text>
  <text x="425" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">on a hosted runner</text>
  <rect x="340" y="311" width="170" height="26" rx="13" fill="#272115" stroke="#e3b341" stroke-width="1"/>
  <text x="425" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e3b341">checkout &amp; setup</text>
  <rect x="340" y="345" width="170" height="26" rx="13" fill="#272115" stroke="#e3b341" stroke-width="1"/>
  <text x="425" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e3b341">executes .lock.yml</text>
  </g>

  <!-- Arrow 2 -->
  <line x1="540" y1="312" x2="605" y2="312" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Step 2 -->
  <circle cx="572" cy="300" r="11" fill="#2f81f7"/>
  <text x="572" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">2</text>

  <!-- Node 3: AI Model -->
  <g data-node="ai-model">
  <rect x="605" y="222" width="205" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="605" y="222" width="205" height="36" rx="10" fill="#201833"/>
  <rect x="605" y="240" width="205" height="18" fill="#201833"/>
  <text x="707" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d2a8ff">AI Model</text>
  <text x="707" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Reads context</text>
  <text x="707" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Follows the brief</text>
  <rect x="643" y="311" width="128" height="26" rx="13" fill="#201833" stroke="#d2a8ff" stroke-width="1"/>
  <text x="707" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">natural language</text>
  <rect x="643" y="345" width="128" height="26" rx="13" fill="#201833" stroke="#d2a8ff" stroke-width="1"/>
  <text x="707" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#d2a8ff">generates output</text>
  </g>

  <!-- Arrow 3 -->
  <line x1="810" y1="312" x2="880" y2="312" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- Step 3 -->
  <circle cx="845" cy="300" r="11" fill="#2f81f7"/>
  <text x="845" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f0f6fc">3</text>

  <!-- Node 4: Output -->
  <g data-node="safe-output">
  <rect x="880" y="222" width="150" height="180" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="880" y="222" width="150" height="36" rx="10" fill="#1a2e22"/>
  <rect x="880" y="240" width="150" height="18" fill="#1a2e22"/>
  <text x="955" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#3fb950">Output</text>
  <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z" fill="#8b949e" transform="translate(906 269) scale(.7)"/>
  <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z" fill="#8b949e" transform="translate(906 269) scale(.7)"/>
  <text x="924" y="279" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Issue</text>
  <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z" fill="#8b949e" transform="translate(906 287) scale(.7)"/>
  <text x="924" y="297" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Pull request</text>
  <path d="m8.878.392 5.25 3.045c.54.314.872.89.872 1.514v6.098a1.75 1.75 0 0 1-.872 1.514l-5.25 3.045a1.75 1.75 0 0 1-1.756 0l-5.25-3.045A1.75 1.75 0 0 1 1 11.049V4.951c0-.624.332-1.201.872-1.514L7.122.392a1.75 1.75 0 0 1 1.756 0ZM7.875 1.69l-4.63 2.685L8 7.133l4.755-2.758-4.63-2.685a.248.248 0 0 0-.25 0ZM2.5 5.677v5.372c0 .09.047.171.125.216l4.625 2.683V8.432Zm6.25 8.271 4.625-2.683a.25.25 0 0 0 .125-.216V5.677L8.75 8.432Z" fill="#8b949e" transform="translate(906 305) scale(.7)"/>
  <text x="924" y="315" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Artifact</text>
  <path d="M11.93 8.5a4.002 4.002 0 0 1-7.86 0H.75a.75.75 0 0 1 0-1.5h3.32a4.002 4.002 0 0 1 7.86 0h3.32a.75.75 0 0 1 0 1.5Zm-1.43-.75a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z" fill="#8b949e" transform="translate(906 323) scale(.7)"/>
  <text x="924" y="333" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Commit</text>
  <rect x="893" y="347" width="124" height="26" rx="13" fill="#1a2e22" stroke="#3fb950" stroke-width="1"/>
  <path data-state="success" d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z" fill="#3fb950" transform="translate(904 352) scale(.75)"/>
  <text x="963" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">safe</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">gh-aw is the compiler: run gh aw compile once to produce the .lock.yml. GitHub Actions executes it directly — gh-aw does not run inside the workflow.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-green-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
