<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Agentic workflow architecture: at compile time, gh aw compile converts a .md workflow into a .lock.yml; at runtime, a trigger fires GitHub Actions, which executes the .lock.yml and calls an AI model to produce safe outputs">
  <!-- Background -->
  <rect width="1200" height="580" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#24292f">Agentic Workflow Architecture</text>
  <text x="600" y="64" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#57606a">What you built: how a gh-aw workflow runs end to end</text>

  <!-- ──────────────── Compile-time zone ──────────────── -->
  <text x="310" y="76" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">compile time</text>
  <rect x="43" y="80" width="597" height="106" rx="6" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Node A: .md workflow -->
  <rect x="60" y="90" width="140" height="70" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="60" y="90" width="140" height="28" rx="8" fill="#ddf4ff"/>
  <rect x="60" y="108" width="140" height="10" fill="#ddf4ff"/>
  <text x="130" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0550ae">.md workflow</text>
  <text x="130" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">your workflow</text>
  <text x="130" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">definition</text>

  <!-- Arrow A to B -->
  <line x1="200" y1="125" x2="258" y2="125" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-light)"/>

  <!-- Node B: gh aw compile (the compiler CLI — runs at author time, not in GitHub Actions) -->
  <rect x="258" y="90" width="175" height="70" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <rect x="258" y="90" width="175" height="28" rx="8" fill="#0969da"/>
  <rect x="258" y="108" width="175" height="10" fill="#0969da"/>
  <text x="345" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">gh aw compile</text>
  <text x="345" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">compiles .md</text>
  <text x="345" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">into .lock.yml</text>

  <!-- Arrow B to C -->
  <line x1="433" y1="125" x2="494" y2="125" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow-light)"/>

  <!-- Node C: .lock.yml (compiled artifact committed to the repository) -->
  <rect x="494" y="90" width="132" height="70" rx="8" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <rect x="494" y="90" width="132" height="28" rx="8" fill="#dff7e9"/>
  <rect x="494" y="108" width="132" height="10" fill="#dff7e9"/>
  <text x="560" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1a7f37">.lock.yml</text>
  <text x="560" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">compiled workflow</text>
  <text x="560" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">committed to repo</text>

  <!-- Connector: .lock.yml feeds into GitHub Actions at runtime -->
  <path d="M 560 160 L 560 200 L 425 200 L 425 222" stroke="#1a7f37" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow-green-light)"/>

  <!-- ──────────────── Runtime zone ──────────────── -->
  <text x="558" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">your practice repository workflow run</text>
  <rect x="43" y="210" width="1030" height="248" rx="6" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3"/>

  <!-- Node 1: Trigger -->
  <rect x="60" y="222" width="195" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="60" y="222" width="195" height="36" rx="10" fill="#ddf4ff"/>
  <rect x="60" y="240" width="195" height="18" fill="#ddf4ff"/>
  <text x="157" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0550ae">Trigger</text>
  <text x="157" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">on: schedule</text>
  <text x="157" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">workflow_dispatch</text>
  <rect x="91" y="311" width="132" height="26" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <text x="157" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0550ae">⏰ Daily schedule</text>
  <rect x="91" y="345" width="132" height="26" rx="13" fill="#ddf4ff" stroke="#0969da" stroke-width="1"/>
  <path d="m101 351 8 7-8 7Z" fill="#0550ae"/>
  <text x="165" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#0550ae">Manual run</text>

  <!-- Arrow 1 -->
  <line x1="255" y1="312" x2="310" y2="312" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 1 -->
  <circle cx="282" cy="300" r="11" fill="#0969da"/>
  <text x="282" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">1</text>

  <!-- Node 2: GitHub Actions (executes the compiled .lock.yml directly) -->
  <rect x="310" y="222" width="230" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="310" y="222" width="230" height="36" rx="10" fill="#fff8c5"/>
  <rect x="310" y="240" width="230" height="18" fill="#fff8c5"/>
  <text x="425" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#7d4e00">GitHub Actions</text>
  <text x="425" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">Runs the job</text>
  <text x="425" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">on a hosted runner</text>
  <rect x="340" y="311" width="170" height="26" rx="13" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
  <text x="425" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7d4e00">checkout &amp; setup</text>
  <rect x="340" y="345" width="170" height="26" rx="13" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
  <text x="425" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#7d4e00">executes .lock.yml</text>

  <!-- Arrow 2 -->
  <line x1="540" y1="312" x2="605" y2="312" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 2 -->
  <circle cx="572" cy="300" r="11" fill="#0969da"/>
  <text x="572" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">2</text>

  <!-- Node 3: AI Model -->
  <rect x="605" y="222" width="205" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="605" y="222" width="205" height="36" rx="10" fill="#fbefff"/>
  <rect x="605" y="240" width="205" height="18" fill="#fbefff"/>
  <text x="707" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6e40c9">AI Model</text>
  <text x="707" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">Reads context</text>
  <text x="707" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#57606a">Follows the brief</text>
  <rect x="643" y="311" width="128" height="26" rx="13" fill="#fbefff" stroke="#6e40c9" stroke-width="1"/>
  <text x="707" y="328" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e40c9">natural language</text>
  <rect x="643" y="345" width="128" height="26" rx="13" fill="#fbefff" stroke="#6e40c9" stroke-width="1"/>
  <text x="707" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#6e40c9">generates output</text>

  <!-- Arrow 3 -->
  <line x1="810" y1="312" x2="880" y2="312" stroke="#57606a" stroke-width="2" marker-end="url(#arrow-light)"/>

  <!-- Step 3 -->
  <circle cx="845" cy="300" r="11" fill="#0969da"/>
  <text x="845" y="304" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff">3</text>

  <!-- Node 4: Output -->
  <rect x="880" y="222" width="150" height="180" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="880" y="222" width="150" height="36" rx="10" fill="#dff7e9"/>
  <rect x="880" y="240" width="150" height="18" fill="#dff7e9"/>
  <text x="955" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a7f37">Output</text>
  <text x="955" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Issue / PR</text>
  <text x="955" y="297" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">comment</text>
  <text x="955" y="315" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Artifact</text>
  <text x="955" y="333" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#57606a">Commit</text>
  <rect x="893" y="347" width="124" height="26" rx="13" fill="#dff7e9" stroke="#1a7f37" stroke-width="1"/>
  <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z" fill="#1a7f37" transform="translate(904 352) scale(.75)"/>
  <text x="963" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#1a7f37">safe</text>

  <!-- Bottom annotation -->
  <text x="600" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">gh-aw is the compiler: run gh aw compile once to produce the .lock.yml. GitHub Actions executes it directly — gh-aw does not run inside the workflow.</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-light" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green-light" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1a7f37"/>
    </marker>
  </defs>
</svg>
