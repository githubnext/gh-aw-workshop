<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Decision path for a permission denied error: if the failing call only reads data, add the matching permissions scope at read; if it changes GitHub state, allowlist the output in safe-outputs with a max." data-visual-kind="diagram" data-visual-id="09-permission-denied-decision">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b6bfb8"/></marker>
  </defs>
  <rect width="1200" height="560" fill="#101411"/>
  <text x="600" y="50" font-family="'Mona Sans',system-ui,sans-serif" font-size="28" font-weight="700" fill="#f2f5f3" text-anchor="middle">Fixing permission denied</text>
  <text x="600" y="82" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">Ask what the failing call does, then adjust the matching control.</text>

  <g data-node="error">
    <rect x="40" y="200" width="250" height="100" rx="12" fill="#0a241b" stroke="#909692" stroke-width="2"/>
    <text x="165" y="243" font-family="'Mona Sans Mono',ui-monospace,monospace" font-size="20" font-weight="700" fill="#f2f5f3" text-anchor="middle">permission denied</text>
    <text x="165" y="273" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">seen in the run log</text>
  </g>
  <g data-node="question">
    <rect x="370" y="190" width="290" height="120" rx="12" fill="#0a241b" stroke="#5fed83" stroke-width="3"/>
    <text x="515" y="240" font-family="'Mona Sans',system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2f5f3" text-anchor="middle">Does the call change</text>
    <text x="515" y="270" font-family="'Mona Sans',system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2f5f3" text-anchor="middle">GitHub state?</text>
  </g>
  <g data-node="read-fix">
    <rect x="780" y="120" width="380" height="120" rx="12" fill="#0a241b" stroke="#909692" stroke-width="2"/>
    <text x="970" y="168" font-family="'Mona Sans Mono',ui-monospace,monospace" font-size="22" font-weight="700" fill="#5fed83" text-anchor="middle">permissions:</text>
    <text x="970" y="203" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">Add the matching scope at read</text>
  </g>
  <g data-node="write-fix">
    <rect x="780" y="270" width="380" height="120" rx="12" fill="#0a241b" stroke="#909692" stroke-width="2"/>
    <text x="970" y="318" font-family="'Mona Sans Mono',ui-monospace,monospace" font-size="22" font-weight="700" fill="#5fed83" text-anchor="middle">safe-outputs:</text>
    <text x="970" y="353" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">Allowlist the output with a max</text>
  </g>

  <path d="M290 250H370" stroke="#b6bfb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 250H720V180H780" stroke="#b6bfb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M720 250V330H780" stroke="#b6bfb8" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <g data-node="chip-no">
    <rect x="672" y="130" width="96" height="32" rx="16" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <text x="720" y="152" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#f2f5f3" text-anchor="middle">No: read</text>
  </g>
  <g data-node="chip-yes">
    <rect x="672" y="350" width="96" height="32" rx="16" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <text x="720" y="372" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#f2f5f3" text-anchor="middle">Yes: write</text>
  </g>

  <circle cx="40" cy="200" r="16" fill="#5fed83"/><text x="40" y="206" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">1</text>
  <circle cx="370" cy="190" r="16" fill="#5fed83"/><text x="370" y="196" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">2</text>
  <circle cx="780" cy="120" r="16" fill="#5fed83"/><text x="780" y="126" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">3</text>

  <text x="600" y="480" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">permissions: is not a write switch. Write intent lives in safe-outputs:.</text>
  <text x="600" y="510" font-family="'Mona Sans',system-ui,sans-serif" font-size="18" fill="#b6bfb8" text-anchor="middle">Keep both minimal.</text>
</svg>
