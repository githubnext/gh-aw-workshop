<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="Agent-assisted compile loop: user writes a Markdown source file, pastes a compile prompt to the Agentic Workflows agent, the agent compiles the source into a lock file and proposes a diff, the user reviews and approves, and the agent commits both files to main.">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Main card -->
  <rect x="30" y="20" width="1140" height="520" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="18" font-weight="600" fill="#c9d1d9">Agent-Assisted Compile Loop (UI Path)</text>
  <text x="600" y="80" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#8b949e">How the Agentic Workflows agent compiles your source file without a terminal</text>

  <!-- Step boxes -->
  <!-- Step 1: Write .md source -->
  <rect x="60" y="120" width="180" height="80" rx="8" ry="8" fill="#0b2f5c" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="150" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#58a6ff">① You</text>
  <text x="150" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">Create</text>
  <text x="150" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">daily-report-status.md</text>

  <!-- Arrow 1→2 -->
  <line x1="241" y1="160" x2="299" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Paste prompt -->
  <rect x="300" y="120" width="180" height="80" rx="8" ry="8" fill="#0b2f5c" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="390" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#58a6ff">② You</text>
  <text x="390" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">Paste compile prompt</text>
  <text x="390" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">to Agents tab</text>

  <!-- Arrow 2→3 -->
  <line x1="481" y1="160" x2="539" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Agent compiles -->
  <rect x="540" y="120" width="180" height="80" rx="8" ry="8" fill="#0f2d1f" stroke="#238636" stroke-width="1.5"/>
  <text x="630" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#238636">③ Agent</text>
  <text x="630" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">Runs gh aw compile</text>
  <text x="630" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">→ generates .lock.yml</text>

  <!-- Arrow 3→4 -->
  <line x1="721" y1="160" x2="779" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Agent proposes diff -->
  <rect x="780" y="120" width="180" height="80" rx="8" ry="8" fill="#0f2d1f" stroke="#238636" stroke-width="1.5"/>
  <text x="870" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#238636">④ Agent</text>
  <text x="870" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">Proposes diff for</text>
  <text x="870" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">your review</text>

  <!-- Arrow 4→5 -->
  <line x1="961" y1="160" x2="1019" y2="160" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5: User approves + Agent commits -->
  <rect x="1020" y="120" width="120" height="80" rx="8" ry="8" fill="#0b2f5c" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="1080" y="148" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="600" fill="#58a6ff">⑤ You</text>
  <text x="1080" y="167" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">Approve</text>
  <text x="1080" y="182" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#c9d1d9">commit</text>

  <!-- Output box at bottom -->
  <rect x="340" y="300" width="520" height="100" rx="8" ry="8" fill="#3f2f00" stroke="#d29922" stroke-width="1.5"/>
  <text x="600" y="330" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#d29922">Result: Two files committed to main</text>
  <text x="600" y="355" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#c9d1d9">.github/workflows/daily-report-status.md</text>
  <text x="600" y="375" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="12" fill="#c9d1d9">.github/workflows/daily-report-status.lock.yml</text>
  <text x="600" y="395" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">(lock.yml is what GitHub Actions runs)</text>

  <!-- Arrow from step 5 down to result -->
  <line x1="1080" y1="201" x2="1080" y2="340" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3"/>
  <line x1="1080" y1="340" x2="862" y2="340" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arrow)"/>

  <!-- Key label for source vs compiled -->
  <rect x="60" y="280" width="220" height="55" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="170" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#8b949e">Source file (.md)</text>
  <text x="170" y="316" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">YAML frontmatter + Markdown task brief</text>
  <text x="170" y="330" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">← you author this</text>

  <rect x="920" y="280" width="220" height="55" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="1030" y="300" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#8b949e">Compiled file (.lock.yml)</text>
  <text x="1030" y="316" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">Standard Actions YAML</text>
  <text x="1030" y="330" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="10" fill="#8b949e">← gh aw compile generates this</text>

  <!-- Next step badge -->
  <rect x="445" y="440" width="310" height="40" rx="20" fill="#58a6ff"/>
  <text x="600" y="465" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="600" fill="#161b22">→ Ready for Step 8: Run Your Workflow</text>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- Footer annotation -->
  <text x="600" y="510" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="11" fill="#8b949e">The Agentic Workflows agent acts as your compiler — no terminal needed. Always review the diff before approving.</text>
</svg>
