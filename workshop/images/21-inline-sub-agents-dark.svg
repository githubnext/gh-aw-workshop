<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Inline sub-agent pattern: parent agent plans and delegates repeated tasks to sub-agents, then assembles the final output">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="#f0f6fc">Inline Sub-Agent Pattern</text>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#8b949e">One workflow file · parent agent plans · sub-agents handle repeated tasks</text>

  <!-- ── Workflow file boundary ── -->
  <rect x="60" y="80" width="1080" height="420" rx="12" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="82" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">daily-status.md  (single workflow file)</text>

  <!-- ── TRIGGER box ── -->
  <rect x="90" y="118" width="160" height="64" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="170" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#f0f6fc">Trigger</text>
  <text x="170" y="163" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">schedule / workflow_dispatch</text>

  <!-- arrow trigger → parent -->
  <line x1="250" y1="150" x2="310" y2="150" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-dark)"/>

  <!-- ── PARENT AGENT box ── -->
  <rect x="310" y="90" width="230" height="320" rx="10" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <rect x="310" y="90" width="230" height="34" rx="10" fill="#2f81f7"/>
  <rect x="310" y="108" width="230" height="16" fill="#2f81f7"/>
  <text x="425" y="113" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#ffffff">Parent Agent</text>
  <text x="425" y="143" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#8b949e">model: frontier</text>

  <!-- parent steps -->
  <rect x="328" y="158" width="194" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="179" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#f0f6fc">① Fetch list of open issues</text>

  <rect x="328" y="200" width="194" height="32" rx="6" fill="#1c2a3e" stroke="#2f81f7" stroke-width="1"/>
  <text x="425" y="221" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2f81f7">② Call sub-agent per issue ↓</text>

  <rect x="328" y="242" width="194" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="263" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#f0f6fc">③ Collect summaries</text>

  <rect x="328" y="284" width="194" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#f0f6fc">④ Write final report</text>

  <rect x="328" y="326" width="194" height="32" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="425" y="347" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#f0f6fc">⑤ Post via safe output</text>

  <!-- ── SUB-AGENT block ── -->
  <rect x="310" y="380" width="230" height="96" rx="8" fill="#1e1a0e" stroke="#c9922a" stroke-width="1.5"/>
  <text x="425" y="400" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#e3b341">## agent: `issue-summarizer`</text>
  <text x="425" y="418" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">model: small</text>
  <text x="425" y="436" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Reads one issue →</text>
  <text x="425" y="452" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">returns one sentence</text>

  <!-- arrow parent ② → sub-agent -->
  <line x1="425" y1="358" x2="425" y2="378" stroke="#2f81f7" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow-blue-dark)"/>

  <!-- ── ISSUE cards ── -->
  <rect x="620" y="155" width="160" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f0f6fc">Issue #1</text>
  <text x="700" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Bug: login fails on Safari</text>

  <rect x="620" y="225" width="160" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f0f6fc">Issue #2</text>
  <text x="700" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Feature: dark mode toggle</text>

  <rect x="620" y="295" width="160" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="700" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#f0f6fc">Issue #3</text>
  <text x="700" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Docs: update API reference</text>

  <!-- arrows parent → issues -->
  <line x1="540" y1="221" x2="618" y2="182" stroke="#c9922a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gold-dark)"/>
  <line x1="540" y1="221" x2="618" y2="251" stroke="#c9922a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gold-dark)"/>
  <line x1="540" y1="221" x2="618" y2="321" stroke="#c9922a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gold-dark)"/>

  <!-- ── SUMMARY output cards ── -->
  <rect x="850" y="155" width="220" height="52" rx="6" fill="#0f2419" stroke="#3fb950" stroke-width="1.5"/>
  <text x="960" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#3fb950">Summary #1</text>
  <text x="960" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Login breaks in Safari due to …</text>

  <rect x="850" y="225" width="220" height="52" rx="6" fill="#0f2419" stroke="#3fb950" stroke-width="1.5"/>
  <text x="960" y="246" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#3fb950">Summary #2</text>
  <text x="960" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Request to add a dark mode …</text>

  <rect x="850" y="295" width="220" height="52" rx="6" fill="#0f2419" stroke="#3fb950" stroke-width="1.5"/>
  <text x="960" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#3fb950">Summary #3</text>
  <text x="960" y="334" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">API docs need refreshing …</text>

  <!-- arrows issues → summaries -->
  <line x1="780" y1="181" x2="848" y2="181" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green-dark)"/>
  <line x1="780" y1="251" x2="848" y2="251" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green-dark)"/>
  <line x1="780" y1="321" x2="848" y2="321" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arrow-green-dark)"/>

  <!-- ── FINAL REPORT ── -->
  <rect x="850" y="380" width="220" height="72" rx="8" fill="#161b22" stroke="#2f81f7" stroke-width="2"/>
  <text x="960" y="405" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#2f81f7">Final Report</text>
  <text x="960" y="423" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">Assembled numbered list</text>
  <text x="960" y="440" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#8b949e">posted via safe output</text>

  <!-- arrow summaries → final report -->
  <line x1="960" y1="348" x2="960" y2="378" stroke="#2f81f7" stroke-width="2" marker-end="url(#arrow-blue-dark)"/>

  <!-- label "× N" -->
  <rect x="541" y="200" width="44" height="20" rx="4" fill="#1e1a0e" stroke="#c9922a" stroke-width="1"/>
  <text x="563" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#e3b341">× N items</text>

  <!-- ── Bottom annotation ── -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#8b949e">The parent agent (frontier model) handles planning and assembly; sub-agents (small model) do the repeated per-item work.</text>

  <!-- Marker defs -->
  <defs>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#30363d"/>
    </marker>
    <marker id="arrow-blue-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f81f7"/>
    </marker>
    <marker id="arrow-gold-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#c9922a"/>
    </marker>
    <marker id="arrow-green-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>
</svg>
