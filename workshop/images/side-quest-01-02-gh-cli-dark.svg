      <text x="480.0" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8b949e">A terminal tool for GitHub actions like auth checks, repo inspection, and workflow commands</text>
