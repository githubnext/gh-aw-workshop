<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="Runner label dispatch: how runs-on labels in frontmatter route a workflow job to a matching self-hosted runner"
     data-visual-kind="diagram" data-visual-id="24-runner-label-dispatch-dark">

  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Title -->
  <text x="600" y="44" font-family="'Mona Sans',system-ui,sans-serif" font-size="22" font-weight="700"
        fill="#f2f5f3" text-anchor="middle">Runner Label Dispatch</text>
  <text x="600" y="68" font-family="'Mona Sans',system-ui,sans-serif" font-size="15" font-weight="400"
        fill="#b6bfb8" text-anchor="middle">How <tspan font-family="'Mona Sans Mono',monospace">runs-on:</tspan> labels route your workflow job to the right runner</text>

  <!-- ===== NODE 1: Workflow frontmatter ===== -->
  <g data-node="workflow-frontmatter">
    <rect x="40" y="110" width="240" height="180" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <!-- header bar -->
    <rect x="40" y="110" width="240" height="36" rx="10" fill="#232925"/>
    <rect x="40" y="130" width="240" height="16" fill="#232925"/>
    <text x="160" y="134" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="600"
          fill="#f2f5f3" text-anchor="middle">Workflow Frontmatter</text>
    <!-- code block -->
    <rect x="56" y="156" width="208" height="118" rx="6" fill="#101411"/>
    <text x="68" y="175" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#b6bfb8">---</text>
    <text x="68" y="193" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#b6bfb8">name: daily-status</text>
    <text x="68" y="211" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#5fed83" font-weight="700">runs-on:</text>
    <text x="68" y="229" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#5fed83" font-weight="700">  - self-hosted</text>
    <text x="68" y="247" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#5fed83" font-weight="700">  - linux</text>
    <text x="68" y="265" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="13" fill="#b6bfb8">---</text>
  </g>

  <!-- ===== ARROW 1: frontmatter → dispatcher ===== -->
  <line x1="280" y1="200" x2="370" y2="200" stroke="#909692" stroke-width="2"/>
  <polygon points="370,193 384,200 370,207" fill="#909692"/>
  <!-- label badge -->
  <rect x="288" y="183" width="80" height="22" rx="11" fill="#232925" stroke="#909692" stroke-width="1"/>
  <text x="328" y="199" font-family="'Mona Sans',system-ui,sans-serif" font-size="11" font-weight="600"
        fill="#b6bfb8" text-anchor="middle">triggers job</text>

  <!-- ===== NODE 2: Actions Dispatcher ===== -->
  <g data-node="actions-dispatcher">
    <rect x="384" y="130" width="200" height="140" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <!-- header -->
    <rect x="384" y="130" width="200" height="36" rx="10" fill="#232925"/>
    <rect x="384" y="150" width="200" height="16" fill="#232925"/>
    <text x="484" y="154" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="600"
          fill="#f2f5f3" text-anchor="middle">Actions Dispatcher</text>
    <circle cx="484" cy="195" r="22" fill="#232925" stroke="#909692" stroke-width="1.5"/>
    <!-- play triangle -->
    <polygon points="477,185 477,205 497,195" fill="#5fed83"/>
    <text x="484" y="238" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" font-weight="400"
          fill="#b6bfb8" text-anchor="middle">Reads labels from</text>
    <text x="484" y="254" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" font-weight="400"
          fill="#b6bfb8" text-anchor="middle"><tspan font-family="'Mona Sans Mono',monospace">runs-on:</tspan> field</text>
  </g>

  <!-- ===== ARROW 2: dispatcher → runner fleet ===== -->
  <line x1="584" y1="200" x2="672" y2="200" stroke="#909692" stroke-width="2"/>
  <polygon points="672,193 686,200 672,207" fill="#909692"/>
  <rect x="590" y="183" width="76" height="22" rx="11" fill="#232925" stroke="#909692" stroke-width="1"/>
  <text x="628" y="199" font-family="'Mona Sans',system-ui,sans-serif" font-size="11" font-weight="600"
        fill="#b6bfb8" text-anchor="middle">label match?</text>

  <!-- ===== NODE 3: Runner Fleet (grouped region) ===== -->
  <g data-node="runner-fleet">
    <rect x="686" y="96" width="474" height="328" rx="12" fill="#0a241b" stroke="#909692" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="923" y="118" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="600"
          fill="#b6bfb8" text-anchor="middle">Runner Fleet</text>

    <!-- Runner A: matched -->
    <g data-node="runner-a" data-state="matched">
      <rect x="706" y="130" width="198" height="120" rx="8" fill="#0a241b" stroke="#5fed83" stroke-width="2"/>
      <rect x="706" y="130" width="198" height="32" rx="8" fill="#08872b"/>
      <rect x="706" y="148" width="198" height="14" fill="#08872b"/>
      <text x="805" y="151" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
            fill="#ffffff" text-anchor="middle">Runner A</text>
      <text x="716" y="178" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" fill="#f2f5f3" font-weight="600">Labels:</text>
      <rect x="716" y="184" width="78" height="20" rx="10" fill="#232925" stroke="#5fed83" stroke-width="1"/>
      <text x="755" y="198" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#5fed83"
            font-weight="700" text-anchor="middle">self-hosted</text>
      <rect x="800" y="184" width="42" height="20" rx="10" fill="#232925" stroke="#5fed83" stroke-width="1"/>
      <text x="821" y="198" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#5fed83"
            font-weight="700" text-anchor="middle">linux</text>
      <rect x="716" y="214" width="168" height="24" rx="6" fill="#232925"/>
      <!-- check-circle Octicon (MIT-licensed Primer Octicon, 16px, scaled) -->
      <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z"
            fill="#5fed83" transform="translate(720,216) scale(0.75)" aria-hidden="true"/>
      <text x="746" y="231" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" fill="#5fed83" font-weight="700">All labels match</text>
    </g>

    <!-- Runner B: mismatch -->
    <g data-node="runner-b" data-state="no-match">
      <rect x="922" y="130" width="218" height="120" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
      <rect x="922" y="130" width="218" height="32" rx="8" fill="#232925"/>
      <rect x="922" y="148" width="218" height="14" fill="#232925"/>
      <text x="1031" y="151" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
            fill="#f2f5f3" text-anchor="middle">Runner B</text>
      <text x="932" y="178" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" fill="#f2f5f3" font-weight="600">Labels:</text>
      <rect x="932" y="184" width="78" height="20" rx="10" fill="#232925" stroke="#909692" stroke-width="1"/>
      <text x="971" y="198" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#b6bfb8"
            text-anchor="middle">self-hosted</text>
      <rect x="1016" y="184" width="60" height="20" rx="10" fill="#232925" stroke="#909692" stroke-width="1"/>
      <text x="1046" y="198" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#b6bfb8"
            text-anchor="middle">windows</text>
      <rect x="932" y="214" width="188" height="24" rx="6" fill="#101411"/>
      <text x="946" y="231" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" fill="#909692">— Label mismatch, skip</text>
    </g>

    <!-- Runner C: no match -->
    <g data-node="runner-c" data-state="no-match">
      <rect x="706" y="272" width="198" height="120" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
      <rect x="706" y="272" width="198" height="32" rx="8" fill="#232925"/>
      <rect x="706" y="290" width="198" height="14" fill="#232925"/>
      <text x="805" y="293" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
            fill="#f2f5f3" text-anchor="middle">GitHub-Hosted</text>
      <text x="716" y="320" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" fill="#f2f5f3" font-weight="600">Labels:</text>
      <rect x="716" y="326" width="88" height="20" rx="10" fill="#232925" stroke="#909692" stroke-width="1"/>
      <text x="760" y="340" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#b6bfb8"
            text-anchor="middle">ubuntu-latest</text>
      <rect x="716" y="356" width="168" height="24" rx="6" fill="#101411"/>
      <text x="730" y="373" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" fill="#909692">— Not self-hosted, skip</text>
    </g>

    <!-- Runner D: busy -->
    <g data-node="runner-d" data-state="idle">
      <rect x="922" y="272" width="218" height="120" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" stroke-dasharray="4,3"/>
      <rect x="922" y="272" width="218" height="32" rx="8" fill="#232925"/>
      <rect x="922" y="290" width="218" height="14" fill="#232925"/>
      <text x="1031" y="293" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
            fill="#909692" text-anchor="middle">Runner D (busy)</text>
      <text x="932" y="320" font-family="'Mona Sans',system-ui,sans-serif" font-size="12" fill="#909692" font-weight="600">Labels:</text>
      <rect x="932" y="326" width="78" height="20" rx="10" fill="#101411" stroke="#909692" stroke-width="1"/>
      <text x="971" y="340" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#909692"
            text-anchor="middle">self-hosted</text>
      <rect x="1016" y="326" width="42" height="20" rx="10" fill="#101411" stroke="#909692" stroke-width="1"/>
      <text x="1037" y="340" font-family="'Mona Sans Mono',monospace,sans-serif" font-size="11" fill="#909692"
            text-anchor="middle">linux</text>
      <rect x="932" y="356" width="188" height="24" rx="6" fill="#101411"/>
      <text x="946" y="373" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" fill="#909692">— Matches, but busy/queued</text>
    </g>
  </g>

  <!-- ===== STEP NUMBERS ===== -->
  <circle cx="160" cy="106" r="14" fill="#08872b"/>
  <text x="160" y="111" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
        fill="#ffffff" text-anchor="middle">1</text>
  <circle cx="484" cy="126" r="14" fill="#08872b"/>
  <text x="484" y="131" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
        fill="#ffffff" text-anchor="middle">2</text>
  <circle cx="923" cy="92" r="14" fill="#08872b"/>
  <text x="923" y="97" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" font-weight="700"
        fill="#ffffff" text-anchor="middle">3</text>

  <!-- Bottom annotation -->
  <text x="600" y="452" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8"
        text-anchor="middle">The dispatcher picks the first <tspan font-weight="700" fill="#f2f5f3">idle</tspan> runner satisfying <tspan font-weight="700" fill="#f2f5f3">all</tspan> required labels.</text>
  <text x="600" y="472" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8"
        text-anchor="middle">Adding labels narrows selection; use multiple labels to target specific OS, architecture, or fleet.</text>

</svg>
