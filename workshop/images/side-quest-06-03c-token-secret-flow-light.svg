<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img" aria-label="From PAT to workflow authentication: you generate a fine-grained personal access token, store it as the COPILOT_GITHUB_TOKEN repository secret, then the agentic workflow reads that secret at run time to authenticate to the Copilot API"
     data-visual-kind="diagram" data-visual-id="side-quest-06-03c-token-secret-flow-light">
  <defs>
    <marker id="arrow-light" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232925"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="48" font-family="'Mona Sans', system-ui, sans-serif" font-size="22" font-weight="700"
        fill="#101411" text-anchor="middle">From PAT to Workflow Authentication</text>
  <text x="600" y="72" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="400"
        fill="#232925" text-anchor="middle">A fine-grained token becomes a secret your workflow reads automatically at run time.</text>

  <!-- ===== NODE 1: Generate PAT ===== -->
  <rect x="60" y="180" width="230" height="130" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="generate-pat"/>
  <!-- key icon -->
  <g transform="translate(155, 198)" fill="none" stroke="#08872b" stroke-width="1.6">
    <circle cx="7" cy="7" r="6"/>
    <line x1="11.2" y1="11.2" x2="22" y2="22"/>
    <line x1="17" y1="17" x2="21" y2="13"/>
    <line x1="20" y1="20" x2="24" y2="16"/>
  </g>
  <text x="175" y="248" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#101411" text-anchor="middle">Generate PAT</text>
  <text x="175" y="268" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="400"
        fill="#232925" text-anchor="middle">Fine-grained token</text>
  <text x="175" y="286" font-family="'Mona Sans Mono', monospace, sans-serif" font-size="12" font-weight="400"
        fill="#232925" text-anchor="middle">Copilot requests: read</text>

  <!-- Step badge 1 -->
  <circle cx="60" cy="180" r="14" fill="#08872b"/>
  <text x="60" y="185" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700"
        fill="#f2f5f3" text-anchor="middle">1</text>

  <!-- Arrow 1->2 -->
  <line x1="291" y1="245" x2="349" y2="245" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="320" y="235" font-family="'Mona Sans', system-ui, sans-serif" font-size="12"
        fill="#232925" text-anchor="middle">copy</text>

  <!-- ===== NODE 2: Store as secret ===== -->
  <rect x="350" y="180" width="230" height="130" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="store-secret"/>
  <!-- lock icon -->
  <g transform="translate(450, 198)" fill="none" stroke="#08872b" stroke-width="1.6">
    <rect x="2" y="9" width="16" height="12" rx="2"/>
    <path d="M5 9V6a5 5 0 0 1 10 0v3"/>
  </g>
  <text x="465" y="248" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#101411" text-anchor="middle">Store as Secret</text>
  <text x="465" y="268" font-family="'Mona Sans Mono', monospace, sans-serif" font-size="12" font-weight="400"
        fill="#232925" text-anchor="middle">COPILOT_GITHUB_TOKEN</text>
  <text x="465" y="286" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="400"
        fill="#232925" text-anchor="middle">Settings → Secrets → Actions</text>

  <!-- Step badge 2 -->
  <circle cx="350" cy="180" r="14" fill="#08872b"/>
  <text x="350" y="185" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700"
        fill="#f2f5f3" text-anchor="middle">2</text>

  <!-- Arrow 2->3 -->
  <line x1="581" y1="245" x2="639" y2="245" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="610" y="235" font-family="'Mona Sans', system-ui, sans-serif" font-size="12"
        fill="#232925" text-anchor="middle">run</text>

  <!-- ===== NODE 3: Workflow run reads secret ===== -->
  <rect x="640" y="180" width="240" height="130" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5" data-node="workflow-run"/>
  <!-- play / workflow octicon -->
  <g transform="translate(740, 198)" fill="#08872b">
    <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm6.271-2.014a.75.75 0 0 1 .75 0l4 2.5a.75.75 0 0 1 0 1.279l-4 2.5a.75.75 0 0 1-1.125-.64V6.625a.75.75 0 0 1 .375-.64z"/>
  </g>
  <text x="760" y="248" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#101411" text-anchor="middle">Workflow Run</text>
  <text x="760" y="268" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="400"
        fill="#232925" text-anchor="middle">Reads secret automatically</text>
  <text x="760" y="286" font-family="'Mona Sans Mono', monospace, sans-serif" font-size="12" font-weight="400"
        fill="#232925" text-anchor="middle">no copilot-requests: write</text>

  <!-- Step badge 3 -->
  <circle cx="640" cy="180" r="14" fill="#08872b"/>
  <text x="640" y="185" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700"
        fill="#f2f5f3" text-anchor="middle">3</text>

  <!-- Arrow 3->4 -->
  <line x1="881" y1="245" x2="939" y2="245" stroke="#232925" stroke-width="2" marker-end="url(#arrow-light)"/>
  <text x="910" y="235" font-family="'Mona Sans', system-ui, sans-serif" font-size="12"
        fill="#232925" text-anchor="middle">authenticate</text>

  <!-- ===== NODE 4: Copilot API ===== -->
  <rect x="940" y="180" width="200" height="130" rx="10" fill="#f2f5f3" stroke="#08872b" stroke-width="1.5" data-node="copilot-api"/>
  <!-- spark icon -->
  <g transform="translate(1025, 198)" fill="#08872b">
    <path d="M10 0 L12.2 6.8 L19 9 L12.2 11.2 L10 18 L7.8 11.2 L1 9 L7.8 6.8 Z"/>
  </g>
  <text x="1040" y="248" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="600"
        fill="#101411" text-anchor="middle">Copilot API</text>
  <text x="1040" y="268" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="400"
        fill="#232925" text-anchor="middle">Personal billing</text>
  <text x="1040" y="286" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="400"
        fill="#232925" text-anchor="middle">AI reasoning steps</text>

  <!-- Step badge 4 -->
  <circle cx="940" cy="180" r="14" fill="#08872b"/>
  <text x="940" y="185" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700"
        fill="#f2f5f3" text-anchor="middle">4</text>

  <!-- ===== Expiry note (dashed grouping) ===== -->
  <rect x="60" y="380" width="340" height="86" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="230" y="408" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="600"
        fill="#101411" text-anchor="middle">Token Expiry</text>
  <text x="230" y="430" font-family="'Mona Sans', system-ui, sans-serif" font-size="13"
        fill="#232925" text-anchor="middle">Default 90 days — set a reminder</text>
  <text x="230" y="450" font-family="'Mona Sans', system-ui, sans-serif" font-size="13"
        fill="#232925" text-anchor="middle">to rotate before it expires</text>

  <line x1="175" y1="310" x2="175" y2="380" stroke="#b6bfb8" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Bottom annotation -->
  <text x="600" y="534" font-family="'Mona Sans', system-ui, sans-serif" font-size="14"
        fill="#232925" text-anchor="middle">Steps 1–2 happen once in the GitHub UI. Steps 3–4 repeat automatically on every workflow run.</text>

</svg>
