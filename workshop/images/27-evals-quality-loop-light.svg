  <text x="1005" y="304" font-family="Mona Sans, Arial, sans-serif" font-size="12" fill="#232925" text-anchor="middle">Diff answers run</text>
  <text x="1005" y="322" font-family="Mona Sans, Arial, sans-serif" font-size="12" fill="#232925" text-anchor="middle">over run to spot flips</text>
  <rect x="850" y="420" width="310" height="60" rx="10" fill="#f2f5f3" stroke="#cf222e" stroke-width="2" stroke-dasharray="6 4" data-node="regression-alert"/>
  <text x="1005" y="446" font-family="Mona Sans, Arial, sans-serif" font-size="14" font-weight="bold" fill="#cf222e" text-anchor="middle">YES to NO flip</text>
  <text x="1005" y="466" font-family="Mona Sans, Arial, sans-serif" font-size="12" fill="#232925" text-anchor="middle">Signals a quality regression</text>
  <line x1="1005" y1="360" x2="1005" y2="420" stroke="#cf222e" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="600" y="500" font-family="Mona Sans, Arial, sans-serif" font-size="14" fill="#232925" text-anchor="middle">Each run scores binary questions from agent output — an answer that flips from YES to NO is a fast regression signal.</text>
  </svg>
