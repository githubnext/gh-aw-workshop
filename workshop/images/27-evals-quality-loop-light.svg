<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Evals quality loop: run workflow, ask binary questions, record YES/NO answers, and compare across runs to catch regressions" data-visual-kind="diagram" data-visual-id="27-evals-quality-loop-light">
