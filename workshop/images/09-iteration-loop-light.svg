<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="Agentic workflow iteration loop: Observe a run, Edit the brief, Compile and push, then Trigger a new run — repeat until the output is useful"
  data-visual-kind="diagram"
  data-visual-id="09-iteration-loop">

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="46" font-family="'Mona Sans', system-ui, sans-serif" font-size="22" font-weight="600" fill="#101411" text-anchor="middle" letter-spacing="0">Agentic Workflow Iteration Loop</text>

  <!-- Annotation -->
  <text x="600" y="530" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="400" fill="#232925" text-anchor="middle">One focused change per round keeps improvements traceable and easy to revert.</text>

  <!-- ── LOOP ARROW (curved arcs connecting the nodes) ── -->
  <!-- Top arc: node1 → node2 -->
  <path d="M 368 220 Q 490 148 612 220" fill="none" stroke="#b6bfb8" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-gray)"/>
  <!-- Top arc: node2 → node3 -->
  <path d="M 788 220 Q 910 148 1032 220" fill="none" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <!-- Right descent: node3 → node4 -->
  <path d="M 1060 312 L 1060 368" fill="none" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <!-- Bottom arc: node4 → node1 (looping back) -->
  <path d="M 888 456 Q 600 530 312 456" fill="none" stroke="#08872b" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-green)"/>

  <!-- Left ascent: node1 start point helper — covered by top arc -->
  <!-- node2 → node3 covered above -->

  <!-- ── Arrowhead markers ── -->
  <defs>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#909692"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#08872b"/>
    </marker>
  </defs>

  <!-- ── NODE 1: Observe ── -->
  <g data-node="observe">
    <rect x="168" y="236" width="200" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <!-- Badge -->
    <circle cx="200" cy="258" r="14" fill="#101411"/>
    <text x="200" y="263" font-family="'Mona Sans Mono', monospace" font-size="14" font-weight="700" fill="#f2f5f3" text-anchor="middle">1</text>
    <!-- Label -->
    <text x="268" y="265" font-family="'Mona Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#101411" text-anchor="middle">Observe</text>
    <text x="268" y="288" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">Review the run output</text>
    <text x="268" y="307" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">in the Actions tab</text>
  </g>

  <!-- ── NODE 2: Edit ── -->
  <g data-node="edit">
    <rect x="592" y="236" width="200" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="624" cy="258" r="14" fill="#101411"/>
    <text x="624" y="263" font-family="'Mona Sans Mono', monospace" font-size="14" font-weight="700" fill="#f2f5f3" text-anchor="middle">2</text>
    <text x="692" y="265" font-family="'Mona Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#101411" text-anchor="middle">Edit</text>
    <text x="692" y="288" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">Update the workflow</text>
    <text x="692" y="307" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">brief or frontmatter</text>
  </g>

  <!-- ── NODE 3: Compile &amp; Push ── -->
  <g data-node="compile">
    <rect x="960" y="236" width="200" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="992" cy="258" r="14" fill="#101411"/>
    <text x="992" y="263" font-family="'Mona Sans Mono', monospace" font-size="14" font-weight="700" fill="#f2f5f3" text-anchor="middle">3</text>
    <text x="1060" y="265" font-family="'Mona Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#101411" text-anchor="middle">Compile</text>
    <text x="1060" y="288" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">gh aw compile</text>
    <text x="1060" y="307" font-family="'Mona Sans Mono', monospace" font-size="13" font-weight="400" fill="#232925" text-anchor="middle">git push</text>
  </g>

  <!-- ── NODE 4: Trigger Run ── -->
  <g data-node="trigger">
    <rect x="960" y="368" width="200" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="992" cy="390" r="14" fill="#101411"/>
    <text x="992" y="395" font-family="'Mona Sans Mono', monospace" font-size="14" font-weight="700" fill="#f2f5f3" text-anchor="middle">4</text>
    <text x="1060" y="397" font-family="'Mona Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#101411" text-anchor="middle">Trigger</text>
    <text x="1060" y="420" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">Run workflow_dispatch</text>
    <text x="1060" y="439" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925" text-anchor="middle">from Actions tab</text>
  </g>

  <!-- ── COMPARE label on loop-back arrow ── -->
  <rect x="490" y="506" width="220" height="28" rx="6" fill="#ffffff" stroke="#b6bfb8" stroke-width="1"/>
  <text x="600" y="524" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#08872b" text-anchor="middle">Compare → decide → repeat</text>

  <!-- ── SKILL chip ── -->
  <rect x="360" y="344" width="232" height="32" rx="16" fill="#0a241b" stroke="#08872b" stroke-width="1.5"/>
  <text x="476" y="364" font-family="'Mona Sans Mono', monospace" font-size="13" font-weight="500" fill="#5fed83" text-anchor="middle">/agentic-workflows  edit | debug | optimize</text>

  <!-- Chip arrow pointing down toward edit node top — just a tiny descender -->
  <line x1="476" y1="236" x2="476" y2="376" stroke="#08872b" stroke-width="1" stroke-dasharray="4 3"/>

</svg>
