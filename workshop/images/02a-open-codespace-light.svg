<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Open Codespace">
  <!-- Page background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com/your-org/your-repo</text>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>

  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="44" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="72" font-family="Arial,sans-serif" font-size="14" fill="#0969da" font-weight="600">Code</text>
  <rect x="30" y="84" width="32" height="3" fill="#0969da" rx="1"/>
  <text x="90" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Issues</text>
  <text x="155" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Pull requests</text>
  <text x="295" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Actions</text>
  <text x="375" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Settings</text>

  <!-- Repo file list bar -->
  <rect x="40" y="105" width="1120" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="133" font-family="Arial,sans-serif" font-size="14" fill="#24292f">main  &#x25BE;</text>

  <!-- Green Code button -->
  <rect x="920" y="115" width="120" height="28" rx="6" fill="#1f883d"/>
  <text x="980" y="134" font-family="Arial,sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">&#x2B07; Code  &#x25BE;</text>

  <!-- Dropdown panel -->
  <rect x="800" y="148" width="280" height="200" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="940" y="172" font-family="Arial,sans-serif" font-size="13" font-weight="600" fill="#57606a" text-anchor="middle">Codespaces</text>
  <line x1="800" y1="180" x2="1080" y2="180" stroke="#d0d7de" stroke-width="1"/>

  <!-- Empty state -->
  <rect x="812" y="190" width="256" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4"/>
  <text x="940" y="218" font-family="Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">No codespaces</text>
  <text x="940" y="238" font-family="Arial,sans-serif" font-size="11" fill="#57606a" text-anchor="middle">You don&#x27;t have any codespaces for this repo.</text>

  <!-- Create codespace button -->
  <rect x="812" y="260" width="256" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="940" y="281" font-family="Arial,sans-serif" font-size="13" fill="#1f2328" text-anchor="middle">+ Create codespace on main</text>

  <!-- Annotation -->
  <text x="600" y="530" font-family="Arial,sans-serif" font-size="24" fill="#57606a" text-anchor="middle">Open Codespace</text>
</svg>