<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Diagram showing how you prompt an agent with the agentic-workflows skill to create daily-report-status.md, which is compiled by gh aw compile into daily-report-status.lock.yml, which GitHub Actions then executes">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <!-- Card -->
  <rect x="40" y="40" width="1120" height="480" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Title -->
  <text x="600" y="82" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc">Agentic Workflow: From Prompt to Execution</text>
  <text x="600" y="104" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Agent + /agentic-workflows skill creates the workflow — you compile and push — GitHub Actions runs it</text>

  <!-- Box 1: Your Prompt (amber) — x=55, w=175 -->
  <rect x="55" y="145" width="175" height="210" rx="10" ry="10" fill="#272216" stroke="#bf8700" stroke-width="2"/>
  <rect x="55" y="145" width="175" height="40" rx="10" ry="10" fill="#bf8700"/>
  <rect x="55" y="165" width="175" height="20" fill="#bf8700"/>
  <text x="143" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Your Prompt</text>
  <text x="143" y="206" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#e3b341">In your AI agent:</text>
  <rect x="70" y="213" width="145" height="97" rx="5" fill="#1e1600" stroke="#bf8700" stroke-width="1"/>
  <text x="143" y="231" text-anchor="middle" font-family="monospace, sans-serif" font-size="10" fill="#e3b341">/agentic-workflows</text>
  <text x="143" y="248" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">Create a</text>
  <text x="143" y="261" text-anchor="middle" font-family="monospace, sans-serif" font-size="10" fill="#2f81f7">daily-report-status</text>
  <text x="143" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">workflow with schedule,</text>
  <text x="143" y="287" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">permissions, safe-outputs</text>
  <text x="143" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">and task brief</text>
  <text x="143" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">You type this 🧑</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="250" x2="270" y2="250" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <circle cx="250" cy="250" r="13" fill="#bf8700"/>
  <text x="250" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <!-- Box 2: daily-report-status.md (blue) — x=270, w=195 -->
  <rect x="270" y="145" width="195" height="210" rx="10" ry="10" fill="#0d1117" stroke="#2f81f7" stroke-width="2"/>
  <rect x="270" y="145" width="195" height="40" rx="10" ry="10" fill="#2f81f7"/>
  <rect x="270" y="165" width="195" height="20" fill="#2f81f7"/>
  <text x="368" y="171" text-anchor="middle" font-family="monospace, sans-serif" font-size="12" font-weight="700" fill="#ffffff">daily-report-status.md</text>
  <text x="368" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">YAML frontmatter</text>
  <rect x="284" y="214" width="167" height="58" rx="5" fill="#1c2d41" stroke="#2f81f7" stroke-width="1"/>
  <text x="368" y="231" text-anchor="middle" font-family="monospace, sans-serif" font-size="10" fill="#2f81f7">on: schedule + dispatch</text>
  <text x="368" y="247" text-anchor="middle" font-family="monospace, sans-serif" font-size="10" fill="#2f81f7">permissions: ...</text>
  <text x="368" y="263" text-anchor="middle" font-family="monospace, sans-serif" font-size="10" fill="#2f81f7">safe-outputs: ...</text>
  <text x="368" y="286" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Task brief</text>
  <rect x="284" y="293" width="167" height="40" rx="5" fill="#272216" stroke="#d29922" stroke-width="1"/>
  <text x="368" y="309" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">Generate an activity</text>
  <text x="368" y="323" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#e3b341">report in a new issue.</text>
  <text x="368" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">Agent-authored 🤖</text>

  <!-- Arrow 2 -->
  <line x1="465" y1="250" x2="505" y2="250" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <circle cx="485" cy="250" r="13" fill="#2f81f7"/>
  <text x="485" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <!-- Box 3: gh aw compile (purple) — x=505, w=160, y=173, h=155 -->
  <rect x="505" y="173" width="160" height="155" rx="10" ry="10" fill="#1e1a2e" stroke="#8957e5" stroke-width="2"/>
  <rect x="505" y="173" width="160" height="36" rx="10" ry="10" fill="#8957e5"/>
  <rect x="505" y="191" width="160" height="18" fill="#8957e5"/>
  <text x="585" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">gh aw compile</text>
  <text x="585" y="228" text-anchor="middle" font-family="monospace, sans-serif" font-size="12" fill="#8957e5">$ gh aw compile</text>
  <text x="585" y="251" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Validates frontmatter</text>
  <text x="585" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Injects agent runner</text>
  <text x="585" y="285" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Generates lock file</text>
  <text x="585" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">Run in terminal 💻</text>

  <!-- Arrow 3 -->
  <line x1="665" y1="250" x2="705" y2="250" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <circle cx="685" cy="250" r="13" fill="#8957e5"/>
  <text x="685" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <!-- Box 4: daily-report-status.lock.yml (green) — x=705, w=195 -->
  <rect x="705" y="145" width="195" height="210" rx="10" ry="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="705" y="145" width="195" height="40" rx="10" ry="10" fill="#3fb950"/>
  <rect x="705" y="165" width="195" height="20" fill="#3fb950"/>
  <text x="803" y="171" text-anchor="middle" font-family="monospace, sans-serif" font-size="11" font-weight="700" fill="#ffffff">daily-report-status.lock.yml</text>
  <text x="803" y="207" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Full GitHub Actions YAML</text>
  <rect x="719" y="214" width="167" height="95" rx="5" fill="#1a2c1e" stroke="#3fb950" stroke-width="1"/>
  <text x="803" y="231" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">name: daily-report-status</text>
  <text x="803" y="246" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">on: schedule + dispatch</text>
  <text x="803" y="261" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">jobs:</text>
  <text x="803" y="276" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">  agent:</text>
  <text x="803" y="291" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">    uses: gh-aw/runner</text>
  <text x="803" y="306" text-anchor="middle" font-family="monospace, sans-serif" font-size="9" fill="#3fb950">    with: ...</text>
  <text x="803" y="332" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">⚠️ Do not edit by hand</text>
  <text x="803" y="347" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">Auto-generated 🔒</text>

  <!-- Arrow 4 -->
  <line x1="900" y1="250" x2="940" y2="250" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <circle cx="920" cy="250" r="13" fill="#3fb950"/>
  <text x="920" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <!-- Box 5: GitHub Actions (red) — x=940, w=185, y=173, h=155 -->
  <rect x="940" y="173" width="185" height="155" rx="10" ry="10" fill="#2d1b1e" stroke="#f85149" stroke-width="2"/>
  <rect x="940" y="173" width="185" height="36" rx="10" ry="10" fill="#f85149"/>
  <rect x="940" y="191" width="185" height="18" fill="#f85149"/>
  <text x="1033" y="196" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">GitHub Actions</text>
  <text x="1033" y="228" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Reads lock file</text>
  <text x="1033" y="245" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Launches AI agent</text>
  <text x="1033" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Executes task brief</text>
  <text x="1033" y="279" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">Posts safe outputs</text>
  <text x="1033" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#8b949e">Triggered on demand ▶️</text>

  <!-- Bottom annotation -->
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#8b949e">Prompt agent → agent creates daily-report-status.md → compile to lock file → commit both → GitHub Actions runs it</text>

  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>
</svg>
