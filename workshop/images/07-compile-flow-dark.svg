<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Diagram showing how daily-report-status.md is compiled by gh aw compile into daily-report-status.lock.yml which GitHub Actions then executes">
  <rect width="1200" height="560" fill="#0d1117"/>
  <rect x="40" y="40" width="1120" height="480" rx="12" ry="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#f0f6fc">Agentic Workflow Compile Flow</text>
  <text x="600" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">From human-readable workflow definition to GitHub Actions execution</text>
  <rect x="80" y="150" width="220" height="230" rx="10" ry="10" fill="#0d1117" stroke="#2f81f7" stroke-width="2"/>
  <rect x="80" y="150" width="220" height="40" rx="10" ry="10" fill="#2f81f7"/>
  <rect x="80" y="170" width="220" height="20" fill="#2f81f7"/>
  <text x="190" y="176" text-anchor="middle" font-family="monospace, sans-serif" font-size="13" font-weight="700" fill="#ffffff">daily-report-status.md</text>
  <text x="190" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">YAML frontmatter</text>
  <rect x="100" y="220" width="180" height="50" rx="5" fill="#1c2d41" stroke="#2f81f7" stroke-width="1"/>
  <text x="190" y="240" text-anchor="middle" font-family="monospace" font-size="11" fill="#2f81f7">---</text>
  <text x="190" y="255" text-anchor="middle" font-family="monospace" font-size="11" fill="#2f81f7">on: workflow_dispatch</text>
  <text x="190" y="270" text-anchor="middle" font-family="monospace" font-size="11" fill="#2f81f7">---</text>
  <text x="190" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Markdown task brief</text>
  <rect x="100" y="302" width="180" height="60" rx="5" fill="#272216" stroke="#d29922" stroke-width="1"/>
  <text x="190" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e3b341">Read all open issues,</text>
  <text x="190" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e3b341">summarize them and</text>
  <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#e3b341">post one comment...</text>
  <text x="190" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8b949e">Human-authored ✏️</text>
  <line x1="300" y1="265" x2="410" y2="265" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <rect x="410" y="195" width="200" height="140" rx="10" ry="10" fill="#1e1a2e" stroke="#8957e5" stroke-width="2"/>
  <rect x="410" y="195" width="200" height="36" rx="10" ry="10" fill="#8957e5"/>
  <rect x="410" y="213" width="200" height="18" fill="#8957e5"/>
  <text x="510" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">gh aw compile</text>
  <text x="510" y="245" text-anchor="middle" font-family="monospace" font-size="13" fill="#8957e5">$ gh aw compile</text>
  <text x="510" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Validates frontmatter</text>
  <text x="510" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Injects agent runner</text>
  <text x="510" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Generates lock file</text>
  <text x="510" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8b949e">Run in terminal 💻</text>
  <line x1="610" y1="265" x2="720" y2="265" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <rect x="720" y="150" width="220" height="230" rx="10" ry="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
  <rect x="720" y="150" width="220" height="40" rx="10" ry="10" fill="#3fb950"/>
  <rect x="720" y="170" width="220" height="20" fill="#3fb950"/>
  <text x="830" y="176" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#ffffff">daily-report-status.lock.yml</text>
  <text x="830" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Full GitHub Actions YAML</text>
  <rect x="740" y="218" width="180" height="100" rx="5" fill="#1a2c1e" stroke="#3fb950" stroke-width="1"/>
  <text x="830" y="238" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">name: daily-report-status</text>
  <text x="830" y="253" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">on: workflow_dispatch</text>
  <text x="830" y="268" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">jobs:</text>
  <text x="830" y="283" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">  agent:</text>
  <text x="830" y="298" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">    uses: gh-aw/runner</text>
  <text x="830" y="313" text-anchor="middle" font-family="monospace" font-size="10" fill="#3fb950">    with: ...</text>
  <text x="830" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8b949e">⚠️ Do not edit by hand</text>
  <text x="830" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8b949e">Auto-generated 🔒</text>
  <line x1="940" y1="265" x2="980" y2="265" stroke="#30363d" stroke-width="2" marker-end="url(#arrowD)"/>
  <rect x="980" y="195" width="180" height="140" rx="10" ry="10" fill="#2d1b1e" stroke="#f85149" stroke-width="2"/>
  <rect x="980" y="195" width="180" height="36" rx="10" ry="10" fill="#f85149"/>
  <rect x="980" y="213" width="180" height="18" fill="#f85149"/>
  <text x="1070" y="217" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">GitHub Actions</text>
  <text x="1070" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Reads lock file</text>
  <text x="1070" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Launches AI agent</text>
  <text x="1070" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Executes task brief</text>
  <text x="1070" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Calls safe outputs</text>
  <text x="1070" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-style="italic" fill="#8b949e">Triggered on demand ▶️</text>
  <text x="600" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">You author daily-report-status.md — compile to generate daily-report-status.lock.yml — commit both to your repository</text>
  <circle cx="355" cy="245" r="14" fill="#2f81f7"/>
  <text x="355" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1</text>
  <circle cx="665" cy="245" r="14" fill="#8957e5"/>
  <text x="665" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2</text>
  <circle cx="960" cy="245" r="14" fill="#3fb950"/>
  <text x="960" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3</text>
  <text x="600" y="532" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#8b949e">Diagram showing how daily-report-status.md is compiled by gh aw compile into daily-report-status.lock.yml which GitHub Actions then executes</text>
  <defs>
    <marker id="arrowD" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#30363d"/>
    </marker>
  </defs>
</svg>
