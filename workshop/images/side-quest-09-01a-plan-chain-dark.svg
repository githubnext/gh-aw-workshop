<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Two workflow briefs compared: a vague brief produces repeated plan steps and no tool call, while an explicit brief leads to a first tool call, a ranking rule, and a comment." data-visual-kind="diagram" data-visual-id="side-quest-09-01a-plan-chain-dark">
<style>text{font-family:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif}.m{font-family:"Mona Sans Mono",ui-monospace,SFMono-Regular,Menlo,monospace}</style>
