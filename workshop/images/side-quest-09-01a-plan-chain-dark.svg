<circle cx="890" cy="390" r="14" fill="#5fed83"/><text x="890" y="396" font-size="16" font-weight="700" text-anchor="middle" fill="#101411">4</text>
<text x="40" y="538" font-size="18" fill="#b6bfb8">Tell the agent what to fetch first and how to rank it, and the [plan] loop ends in a [tool] call.</text>
