<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Diagram showing how an agentic workflow .md source file is compiled by gh aw compile into a .lock.yml file that GitHub Actions runs">
  <!-- Background -->
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f0f6fc">The Two-File Structure</text>
  <text x="600" y="68" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8b949e">You write the .md source — gh aw compile generates the .lock.yml that GitHub Actions runs</text>

  <!-- LEFT BOX: .md source -->
  <rect x="60" y="95" width="420" height="380" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="60" y="95" width="420" height="44" rx="10" fill="#1158c7"/>
  <rect x="60" y="119" width="420" height="20" fill="#1158c7"/>
  <text x="270" y="123" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#f0f6fc">daily-report.md</text>
  <!-- File type badge -->
  <rect x="385" y="104" width="82" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
  <text x="426" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f0f6fc">You write this</text>

  <!-- Frontmatter section label -->
  <rect x="80" y="155" width="120" height="22" rx="4" fill="#1c2e4a" stroke="#2f81f7" stroke-width="1"/>
  <text x="140" y="171" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#2f81f7">FRONTMATTER</text>

  <!-- Frontmatter content -->
  <rect x="80" y="183" width="380" height="108" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="100" y="205" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">---</text>
  <text x="100" y="225" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">on:</text>
  <text x="120" y="245" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  schedule: <tspan fill="#2f81f7">daily</tspan></text>
  <text x="100" y="265" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">permissions:</text>
  <text x="120" y="283" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  issues: <tspan fill="#2f81f7">read</tspan></text>
  <text x="100" y="303" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">---</text>

  <!-- Task brief section label -->
  <rect x="80" y="305" width="100" height="22" rx="4" fill="#1a2e22" stroke="#3fb950" stroke-width="1"/>
  <text x="130" y="321" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#3fb950">TASK BRIEF</text>

  <!-- Task brief content -->
  <rect x="80" y="333" width="380" height="80" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="100" y="358" font-family="system-ui, sans-serif" font-size="13" fill="#f0f6fc">Review all open issues, summarize</text>
  <text x="100" y="378" font-family="system-ui, sans-serif" font-size="13" fill="#f0f6fc">the key themes, and post a short</text>
  <text x="100" y="398" font-family="system-ui, sans-serif" font-size="13" fill="#f0f6fc">digest as a new issue.</text>

  <!-- Bottom annotation -->
  <text x="270" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Plain English + fuzzy shorthand</text>

  <!-- MIDDLE: compile arrow -->
  <g>
    <line x1="490" y1="285" x2="698" y2="285" stroke="#2f81f7" stroke-width="2.5" stroke-dasharray="6,3"/>
    <polygon points="698,278 714,285 698,292" fill="#2f81f7"/>
    <rect x="540" y="255" width="130" height="36" rx="18" fill="#2f81f7"/>
    <text x="605" y="278" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="600" fill="#f0f6fc">gh aw compile</text>
  </g>

  <!-- RIGHT BOX: .lock.yml -->
  <rect x="720" y="95" width="420" height="380" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="720" y="95" width="420" height="44" rx="10" fill="#5a32a3"/>
  <rect x="720" y="119" width="420" height="20" fill="#5a32a3"/>
  <text x="930" y="123" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" font-weight="600" fill="#f0f6fc">daily-report.lock.yml</text>
  <!-- File type badge -->
  <rect x="980" y="104" width="144" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
  <text x="1052" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f0f6fc">GitHub Actions runs this</text>

  <!-- YAML content -->
  <rect x="740" y="155" width="380" height="248" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="760" y="178" font-family="ui-monospace, monospace" font-size="12" fill="#8b949e"># Auto-generated. Do not edit.</text>
  <text x="760" y="200" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">name: <tspan fill="#bc8cff">daily-report</tspan></text>
  <text x="760" y="220" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">on:</text>
  <text x="780" y="240" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  schedule:</text>
  <text x="800" y="260" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">    - cron: <tspan fill="#bc8cff">"0 8 * * *"</tspan></text>
  <text x="780" y="280" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  workflow_dispatch:</text>
  <text x="760" y="300" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">permissions:</text>
  <text x="780" y="320" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  issues: <tspan fill="#bc8cff">read</tspan></text>
  <text x="760" y="340" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">  # … engine, steps, agent config</text>
  <text x="760" y="360" font-family="ui-monospace, monospace" font-size="13" fill="#8b949e">  # … safe-outputs guardrails</text>
  <text x="760" y="390" font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">  # task brief injected here</text>

  <!-- Bottom annotation -->
  <text x="930" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#8b949e">Standard YAML — never hand-edited</text>

  <!-- BOTTOM: GitHub Actions badge -->
  <rect x="780" y="468" width="300" height="36" rx="8" fill="#1c2e4a" stroke="#2f81f7" stroke-width="1"/>
  <text x="930" y="491" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#2f81f7">▶ GitHub Actions executes .lock.yml</text>

  <!-- Both files annotation -->
  <text x="600" y="530" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#8b949e">Both files live in <tspan font-family="ui-monospace, monospace" font-size="13" fill="#f0f6fc">.github/workflows/</tspan> — commit both after every compile</text>
</svg>
