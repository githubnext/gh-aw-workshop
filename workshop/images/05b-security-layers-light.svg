<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="Two-layer security model: a schedule trigger starts an agentic workflow; the agent runs inside a sandbox with a firewall limiting network egress; it emits a structured output request; a separate permission-scoped safe-outputs job validates and applies changes to the repository"
  data-visual-kind="diagram"
  data-visual-id="05b-security-layers">

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="44" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="700" fill="#101411">
    Two-Layer Security Model
  </text>
  <text x="600" y="70" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="14" fill="#232925">
    Sandbox limits what the agent can read and reach; safe-outputs controls every write.
  </text>

  <!-- ── LAYER 1 BOUNDARY: Sandbox / Firewall ─────────────────────── -->
  <rect x="280" y="100" width="560" height="360" rx="12"
    fill="#ffffff" stroke="#b6bfb8" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="560" y="124"
    text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="13" font-weight="600" fill="#232925" letter-spacing="0.04em">
    SANDBOX — Agent Workflow Firewall
  </text>
  <!-- small lock icon (path from primer/octicons lock-16) -->
  <g transform="translate(438,107)" aria-hidden="true">
    <path d="M4 8a4 4 0 0 1 8 0v2H4V8zm-2 2V8a6 6 0 1 1 12 0v2h1a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1H2zm2 0v6h8v-6H4zm4 2a1 1 0 0 1 1 1v2a1 1 0 0 1-2 0v-2a1 1 0 0 1 1-1z"
      fill="#08872b" transform="scale(1.1)"/>
  </g>

  <!-- ── NODE 1: Schedule Trigger ──────────────────────────────────── -->
  <g data-node="schedule-trigger" transform="translate(56,220)">
    <rect x="0" y="0" width="168" height="120" rx="10"
      fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <!-- clock octicon (clock-16) -->
    <g transform="translate(76,16)" aria-hidden="true">
      <path d="M8 1.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13zM0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-3.5a.75.75 0 0 1 .75.75v3.19l1.72 1.72a.75.75 0 1 1-1.06 1.06l-2-2A.75.75 0 0 1 7.25 10V5.25A.75.75 0 0 1 8 4.5z"
        fill="#0969da" transform="scale(1.6) translate(-8,-8)"/>
    </g>
    <text x="84" y="60"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="15" font-weight="600" fill="#101411">Schedule</text>
    <text x="84" y="79"
      text-anchor="middle"
      font-family="'Mona Sans Mono', ui-monospace, monospace"
      font-size="12" fill="#232925">on: schedule</text>
    <text x="84" y="105"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Triggers the workflow</text>
  </g>

  <!-- Arrow: Trigger → Sandbox edge -->
  <line x1="224" y1="280" x2="280" y2="280" stroke="#0969da" stroke-width="2.5"/>
  <polygon points="280,274 294,280 280,286" fill="#0969da"/>

  <!-- ── NODE 2: Agent (inside sandbox) ───────────────────────────── -->
  <g data-node="agent" transform="translate(310,148)">
    <rect x="0" y="0" width="200" height="264" rx="10"
      fill="#f2f5f3" stroke="#08872b" stroke-width="2"/>
    <text x="100" y="28"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="15" font-weight="700" fill="#101411">AI Agent</text>

    <!-- read-only badge -->
    <rect x="28" y="38" width="144" height="24" rx="12" fill="#bfffd1"/>
    <text x="100" y="55"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" font-weight="600" fill="#08872b">Read-only repo access</text>

    <!-- firewall chip -->
    <rect x="16" y="78" width="168" height="52" rx="8"
      fill="#ffffff" stroke="#b6bfb8" stroke-width="1"/>
    <text x="100" y="99"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" font-weight="600" fill="#232925">Firewall</text>
    <text x="100" y="117"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Domain allowlist only</text>

    <!-- detection chip -->
    <rect x="16" y="146" width="168" height="52" rx="8"
      fill="#ffffff" stroke="#b6bfb8" stroke-width="1"/>
    <text x="100" y="167"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" font-weight="600" fill="#232925">Detection</text>
    <text x="100" y="185"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Scans for malicious behavior</text>

    <!-- prompt-injection note -->
    <text x="100" y="232"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Prompt injections blocked</text>
    <text x="100" y="248"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">before reaching the repo</text>
  </g>

  <!-- Arrow: Agent → Output Request -->
  <line x1="510" y1="280" x2="570" y2="280" stroke="#0969da" stroke-width="2.5"/>
  <polygon points="570,274 584,280 570,286" fill="#0969da"/>

  <!-- ── NODE 3: Structured Output Request (inside sandbox) ──────── -->
  <g data-node="output-request" transform="translate(580,204)">
    <rect x="0" y="0" width="192" height="152" rx="10"
      fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <text x="96" y="28"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="14" font-weight="700" fill="#101411">Output Request</text>
    <text x="96" y="48"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Structured declaration</text>
    <!-- code sample lines -->
    <rect x="12" y="60" width="168" height="72" rx="6" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="28" y="80"
      font-family="'Mona Sans Mono', ui-monospace, monospace"
      font-size="11" fill="#101411">create_issue:</text>
    <text x="36" y="96"
      font-family="'Mona Sans Mono', ui-monospace, monospace"
      font-size="11" fill="#232925">title: "Daily digest"</text>
    <text x="36" y="112"
      font-family="'Mona Sans Mono', ui-monospace, monospace"
      font-size="11" fill="#232925">body: "..."</text>
    <text x="96" y="148"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">No write permissions held</text>
  </g>

  <!-- Arrow: leaves sandbox -->
  <line x1="772" y1="280" x2="836" y2="280" stroke="#0969da" stroke-width="2.5"/>
  <polygon points="836,274 850,280 836,286" fill="#0969da"/>

  <!-- ── NODE 4: Safe-Outputs Job ──────────────────────────────────── -->
  <g data-node="safe-outputs" data-state="done" transform="translate(856,188)">
    <rect x="0" y="0" width="192" height="184" rx="10"
      fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
    <!-- done state accent bar -->
    <rect x="0" y="0" width="192" height="6" rx="5" fill="#1a7f37"/>
    <rect x="0" y="6" width="192" height="4" fill="#1a7f37"/>
    <text x="96" y="38"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="14" font-weight="700" fill="#101411">Safe-Outputs Job</text>
    <text x="96" y="56"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Permission-scoped</text>
    <!-- guardrail chips -->
    <rect x="12" y="66" width="168" height="28" rx="6" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="96" y="85"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" fill="#232925">Validates request</text>
    <rect x="12" y="102" width="168" height="28" rx="6" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="96" y="121"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" fill="#232925">Enforces limits &amp; labels</text>
    <rect x="12" y="138" width="168" height="28" rx="6" fill="#f2f5f3" stroke="#b6bfb8" stroke-width="1"/>
    <text x="96" y="157"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="12" fill="#232925">Full audit trail</text>

    <text x="96" y="178"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="11" fill="#232925">Applies changes</text>
  </g>

  <!-- Arrow: Safe-outputs → Repo -->
  <line x1="1048" y1="280" x2="1096" y2="280" stroke="#1a7f37" stroke-width="2.5"/>
  <polygon points="1096,274 1110,280 1096,286" fill="#1a7f37"/>

  <!-- ── NODE 5: Repository ────────────────────────────────────────── -->
  <g data-node="repository" transform="translate(1108,240)">
    <!-- repo octicon (repo-16) -->
    <g transform="translate(4,0)" aria-hidden="true">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8V1.5Z"
        fill="#08872b" transform="scale(2.2) translate(0,-1)"/>
    </g>
    <text x="40" y="50"
      text-anchor="middle"
      font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
      font-size="13" font-weight="600" fill="#101411">Repo</text>
  </g>

  <!-- Layer 1 label at bottom -->
  <text x="560" y="490" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="12" fill="#232925">
    Layer 1: Sandbox constrains the agent's read and network access.
  </text>
  <text x="560" y="510" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="12" fill="#232925">
    Layer 2: Safe-outputs controls every write — the agent never holds write permissions.
  </text>

  <!-- Layer 2 bracket annotation -->
  <rect x="850" y="100" width="210" height="360" rx="12"
    fill="none" stroke="#08872b" stroke-width="2" stroke-dasharray="10,5"/>
  <text x="955" y="124" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="13" font-weight="600" fill="#08872b">
    GUARDRAILED WRITES
  </text>
</svg>
