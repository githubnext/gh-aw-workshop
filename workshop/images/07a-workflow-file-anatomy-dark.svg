<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560"
  role="img"
  aria-label="Agentic workflow file anatomy: frontmatter sections (name, on, permissions, safe-outputs) and the Task body, each mapped to its runtime purpose"
  data-visual-kind="diagram"
  data-visual-id="07a-workflow-file-anatomy">
  <defs>
    <marker id="arr-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#909692"/>
    </marker>
    <marker id="arr-accent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#5fed83"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="20" font-weight="700" fill="#f2f5f3">Agentic Workflow File Anatomy</text>
  <text x="600" y="60" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" fill="#b6bfb8">Every section of daily-report-status.md has a specific runtime role</text>

  <!-- File panel -->
  <rect x="56" y="80" width="360" height="440" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
  <!-- Titlebar -->
  <rect x="56" y="80" width="360" height="32" rx="10" fill="#101411" stroke="#909692" stroke-width="1.5"/>
  <rect x="56" y="96" width="360" height="16" fill="#101411"/>
  <text x="76" y="101" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="14" fill="#b6bfb8">daily-report-status.md</text>

  <!-- top fence -->
  <text x="76" y="130" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="14" fill="#909692">---</text>

  <!-- Frontmatter region (colored region 1: dark tint) -->
  <rect x="64" y="136" width="344" height="178" rx="6" fill="#232925" stroke="none" data-node="frontmatter-region"/>
  <text x="76" y="152" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">name: Daily Report Status</text>
  <text x="76" y="174" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">on:</text>
  <text x="76" y="192" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">  schedule: daily</text>
  <text x="76" y="210" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">  workflow_dispatch: {}</text>
  <text x="76" y="232" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">permissions:</text>
  <text x="76" y="250" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">  contents: read</text>
  <text x="76" y="268" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">  copilot-requests: write</text>
  <text x="76" y="286" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">safe-outputs:</text>
  <text x="76" y="304" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">  create-issue:</text>
  <text x="380" y="148" text-anchor="end" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#b6bfb8">Frontmatter</text>

  <!-- bottom fence -->
  <text x="76" y="326" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="14" fill="#909692">---</text>

  <!-- Task brief region (colored region 2: accent tint) -->
  <rect x="64" y="332" width="344" height="172" rx="6" fill="#0a241b" stroke="#5fed83" stroke-width="1" data-node="task-region"/>
  <text x="76" y="352" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#5fed83">Generate an activity report</text>
  <text x="76" y="370" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">for this repository and post</text>
  <text x="76" y="388" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="13" fill="#b6bfb8">it as a new issue.</text>
  <text x="380" y="348" text-anchor="end" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#5fed83">Task brief</text>

  <!-- === Annotation cards on right === -->

  <!-- Arrows -->
  <line x1="416" y1="200" x2="470" y2="220" stroke="#909692" stroke-width="2" marker-end="url(#arr-neutral)" data-node="arr-frontmatter"/>
  <line x1="416" y1="260" x2="470" y2="310" stroke="#909692" stroke-width="2" marker-end="url(#arr-neutral)"/>
  <line x1="416" y1="295" x2="470" y2="380" stroke="#909692" stroke-width="2" marker-end="url(#arr-neutral)"/>
  <line x1="416" y1="418" x2="470" y2="450" stroke="#5fed83" stroke-width="2" marker-end="url(#arr-accent)" data-node="arr-task"/>

  <!-- Card 1: Trigger -->
  <rect x="470" y="136" width="300" height="68" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="card-trigger"/>
  <text x="486" y="157" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Trigger</text>
  <text x="486" y="176" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">When the workflow runs — scheduled</text>
  <text x="486" y="196" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">daily or on manual dispatch.</text>

  <!-- Card 2: Permissions -->
  <rect x="470" y="218" width="300" height="80" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="card-permissions"/>
  <text x="486" y="239" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Permissions</text>
  <text x="486" y="258" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">Scopes what the agent can read.</text>
  <text x="486" y="276" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">copilot-requests: write is required</text>
  <text x="486" y="294" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">to call the AI model.</text>

  <!-- Card 3: Safe-outputs -->
  <rect x="470" y="312" width="300" height="68" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="card-safe-outputs"/>
  <text x="486" y="333" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Safe-outputs</text>
  <text x="486" y="352" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">Declares which write actions</text>
  <text x="486" y="370" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">the agent may perform.</text>

  <!-- Card 4: Task brief -->
  <rect x="470" y="394" width="300" height="80" rx="8" fill="#0a241b" stroke="#5fed83" stroke-width="1.5" data-node="card-task"/>
  <text x="486" y="415" font-family="'Mona Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#5fed83">Task brief</text>
  <text x="486" y="434" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">Plain-language instructions the</text>
  <text x="486" y="452" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">AI agent reads at runtime to</text>
  <text x="486" y="470" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">decide what to do.</text>

  <!-- Bottom annotation -->
  <text x="600" y="538" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="14" fill="#b6bfb8">Frontmatter (between --- fences) is compiled by gh aw compile · The task brief below is the agent's runtime instructions</text>
</svg>
