<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Animated GitHub Actions run showing four security jobs: activation validates the agent is authorized to run, agent runs with sandbox, firewall, and integrity filter enabled, detection scans for malicious code, and safe-outputs applies changes within guardrails">
  <title>Agentic workflow security jobs</title>
  <style>
    .line { opacity: 0; }
    .line1  { animation: fadein 0.4s 0.3s forwards; }
    .line2  { animation: fadein 0.4s 0.9s forwards; }
    .line3  { animation: fadein 0.4s 1.5s forwards; }
    .line4  { animation: fadein 0.4s 2.1s forwards; }
    .line5  { animation: fadein 0.4s 2.7s forwards; }
    .line6  { animation: fadein 0.4s 3.3s forwards; }
    .line7  { animation: fadein 0.4s 3.9s forwards; }
    .line8  { animation: fadein 0.4s 4.5s forwards; }
    .line9  { animation: fadein 0.4s 5.1s forwards; }
    .line10 { animation: fadein 0.4s 5.7s forwards; }
    .line11 { animation: fadein 0.4s 6.3s forwards; }
    .line12 { animation: fadein 0.4s 6.9s forwards; }
    .line13 { animation: fadein 0.4s 7.5s forwards; }
    .line14 { animation: fadein 0.4s 8.1s forwards; }
    .cursor { animation: blink 1s 0s infinite; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink  { 0%,49%{ opacity:1; } 50%,100%{ opacity:0; } }
  </style>

  <!-- Page background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#57606a" text-anchor="middle">github.com/your-org/daily-status/actions/runs/7</text>
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>

  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="44" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="30" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Code</text>
  <text x="90" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Issues</text>
  <text x="155" y="72" font-family="Arial,sans-serif" font-size="14" fill="#57606a">Pull requests</text>
  <text x="295" y="72" font-family="Arial,sans-serif" font-size="14" fill="#0969da" font-weight="600">Actions</text>
  <rect x="295" y="84" width="52" height="3" fill="#0969da" rx="1"/>

  <!-- Terminal panel -->
  <rect x="40" y="104" width="1120" height="420" rx="8" fill="#0d1117"/>
  <!-- Terminal title bar -->
  <rect x="40" y="104" width="1120" height="36" rx="8" fill="#161b22"/>
  <rect x="40" y="122" width="1120" height="18" fill="#161b22"/>
  <text x="600" y="126" font-family="Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">Actions &#x203A; daily-repo-status &#x203A; Run #7</text>

  <!-- activation job -->
  <g class="line line1">
    <text x="60" y="165" font-family="monospace" font-size="13" fill="#8b949e">&#x25B6;  activation</text>
    <rect x="52" y="172" width="1096" height="1" fill="#21262d"/>
  </g>
  <g class="line line2">
    <text x="76" y="192" font-family="monospace" font-size="12" fill="#3fb950">  &#x2705; Agent is authorized to run</text>
  </g>

  <!-- agent job -->
  <g class="line line3">
    <text x="60" y="218" font-family="monospace" font-size="13" fill="#8b949e">&#x25B6;  agent</text>
    <rect x="52" y="225" width="1096" height="1" fill="#21262d"/>
  </g>
  <g class="line line4">
    <text x="76" y="245" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F512; Sandbox:           <tspan fill="#3fb950">enabled</tspan></text>
  </g>
  <g class="line line5">
    <text x="76" y="265" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F525; Firewall:          <tspan fill="#3fb950">enabled</tspan></text>
  </g>
  <g class="line line6">
    <text x="76" y="285" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F50D; Integrity filter:  <tspan fill="#3fb950">enabled</tspan></text>
  </g>
  <g class="line line7">
    <text x="76" y="305" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F4BE; Saving results to safe outputs...</text>
  </g>

  <!-- detection job -->
  <g class="line line8">
    <text x="60" y="330" font-family="monospace" font-size="13" fill="#8b949e">&#x25B6;  detection</text>
    <rect x="52" y="337" width="1096" height="1" fill="#21262d"/>
  </g>
  <g class="line line9">
    <text x="76" y="357" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F50E; Scanning output for malicious code...</text>
  </g>
  <g class="line line10">
    <text x="76" y="377" font-family="monospace" font-size="12" fill="#3fb950">  &#x2705; No threats detected</text>
  </g>

  <!-- safe-outputs job -->
  <g class="line line11">
    <text x="60" y="402" font-family="monospace" font-size="13" fill="#8b949e">&#x25B6;  safe-outputs</text>
    <rect x="52" y="409" width="1096" height="1" fill="#21262d"/>
  </g>
  <g class="line line12">
    <text x="76" y="429" font-family="monospace" font-size="12" fill="#c9d1d9">  &#x1F6E1;  Applying changes within guardrails...</text>
  </g>
  <g class="line line13">
    <text x="76" y="449" font-family="monospace" font-size="12" fill="#3fb950">  &#x2705; Changes applied safely</text>
  </g>

  <!-- Workflow complete -->
  <g class="line line14">
    <rect x="52" y="464" width="1096" height="1" fill="#21262d"/>
    <text x="60" y="484" font-family="monospace" font-size="13" fill="#3fb950">&#x2705; Workflow completed (34s)</text>
  </g>

  <!-- Blinking cursor -->
  <rect class="cursor" x="60" y="496" width="8" height="14" fill="#c9d1d9"/>

  <!-- Annotation -->
  <text x="600" y="545" font-family="Arial,sans-serif" font-size="18" fill="#57606a" text-anchor="middle">Animated GitHub Actions run: activation, agent, detection, and safe-outputs security jobs</text>
</svg>