<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img"
     aria-label="Codespaces token permission gap: a Codespace's default token lacks actions:write, so running gh aw run fails with HTTP 403. Fix A re-routes through the Actions UI, which runs the workflow with full repository permissions. Fix B creates a new Codespace from a devcontainer.json that grants the terminal token actions:write and workflows:write."
     data-visual-kind="diagram"
     data-visual-id="side-quest-08-01-token-permission-gap">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#909692"/>
    </marker>
    <marker id="arrDanger" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f85149"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5fed83"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Title -->
  <text x="600" y="36" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#f2f5f3">Why gh aw run Fails Inside a Codespace</text>
  <text x="600" y="58" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="14" font-weight="400" fill="#b6bfb8">The default terminal token is missing two permissions</text>

  <!-- STAGE 1: Codespace terminal node -->
  <rect x="48" y="220" width="220" height="104" rx="10"
        fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="codespace"/>
  <!-- Codespaces octicon -->
  <g transform="translate(66, 240) scale(1.25)" fill="#b6bfb8" aria-hidden="true">
    <path d="M0 11.25c0-.966.784-1.75 1.75-1.75h12.5c.966 0 1.75.784 1.75 1.75v3A1.75 1.75 0 0 1 14.25 16H1.75A1.75 1.75 0 0 1 0 14.25Zm2-9.5C2 .784 2.784 0 3.75 0h8.5C13.216 0 14 .784 14 1.75v5a1.75 1.75 0 0 1-1.75 1.75h-8.5A1.75 1.75 0 0 1 2 6.75Zm1.75-.25a.25.25 0 0 0-.25.25v5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-5a.25.25 0 0 0-.25-.25Zm-2 9.5a.25.25 0 0 0-.25.25v3c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-3a.25.25 0 0 0-.25-.25Z"/>
    <path d="M7 12.75a.75.75 0 0 1 .75-.75h4.5a.75.75 0 0 1 0 1.5h-4.5a.75.75 0 0 1-.75-.75Zm-4 0a.75.75 0 0 1 .75-.75h.5a.75.75 0 0 1 0 1.5h-.5a.75.75 0 0 1-.75-.75Z"/>
  </g>
  <text x="158" y="252" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="15" font-weight="700" fill="#f2f5f3">Codespace terminal</text>
  <text x="158" y="272" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="12" fill="#b6bfb8">gh aw run daily-report-status</text>
  <rect x="78" y="284" width="160" height="24" rx="12" fill="#101411" stroke="#909692" stroke-width="1" data-node="token-chip"/>
  <text x="158" y="300" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="11" fill="#b6bfb8">default token</text>

  <!-- Arrow stage1 -> stage2 -->
  <line x1="268" y1="272" x2="330" y2="272" stroke="#909692" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 2: Missing permissions check -->
  <rect x="330" y="216" width="236" height="112" rx="10"
        fill="#0a241b" stroke="#f85149" stroke-width="1.5" data-node="missing-perms"/>
  <g transform="translate(348, 236) scale(1.1)" fill="#f85149" aria-hidden="true">
    <path d="M6.457 1.047c.659-1.234 2.427-1.234 3.086 0l6.082 11.378A1.75 1.75 0 0 1 14.082 15H1.918a1.75 1.75 0 0 1-1.543-2.575Zm1.763.707a.25.25 0 0 0-.44 0L1.698 13.132a.25.25 0 0 0 .22.368h12.164a.25.25 0 0 0 .22-.368Zm.53 3.996v2.5a.75.75 0 0 1-1.5 0v-2.5a.75.75 0 0 1 1.5 0ZM9 11a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/>
  </g>
  <text x="458" y="250" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="15" font-weight="700" fill="#f85149">Token missing scopes</text>
  <text x="458" y="270" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="12" fill="#b6bfb8">actions:write</text>
  <text x="458" y="288" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="12" fill="#b6bfb8">workflows:write</text>
  <text x="458" y="312" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="12" fill="#f85149">HTTP 403</text>

  <!-- Arrow stage2 -> branch point -->
  <line x1="566" y1="272" x2="618" y2="272" stroke="#f85149" stroke-width="2" marker-end="url(#arrDanger)"/>

  <!-- Branch label -->
  <text x="600" y="192" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#b6bfb8">Two recovery paths</text>

  <!-- Branch connector up to Fix A -->
  <line x1="618" y1="272" x2="618" y2="140" stroke="#5fed83" stroke-width="2"/>
  <line x1="618" y1="140" x2="662" y2="140" stroke="#5fed83" stroke-width="2" marker-end="url(#arrGreen)"/>
  <!-- Branch connector down to Fix B -->
  <line x1="618" y1="272" x2="618" y2="420" stroke="#909692" stroke-width="2"/>
  <line x1="618" y1="420" x2="662" y2="420" stroke="#909692" stroke-width="2" marker-end="url(#arr)"/>

  <!-- FIX A: Actions UI (top path) -->
  <rect x="664" y="100" width="256" height="88" rx="10"
        fill="#0a241b" stroke="#5fed83" stroke-width="2" data-node="fix-a"/>
  <rect x="664" y="100" width="6" height="88" rx="3" fill="#5fed83"/>
  <g transform="translate(690, 116) scale(1.1)" fill="#5fed83" aria-hidden="true">
    <path d="M0 1.75C0 .784.784 0 1.75 0h3.5C6.216 0 7 .784 7 1.75v3.5A1.75 1.75 0 0 1 5.25 7H4v4a1 1 0 0 0 1 1h4v-1.25C9 9.784 9.784 9 10.75 9h3.5c.966 0 1.75.784 1.75 1.75v3.5A1.75 1.75 0 0 1 14.25 16h-3.5A1.75 1.75 0 0 1 9 14.25v-.75H5A2.5 2.5 0 0 1 2.5 11V7h-.75A1.75 1.75 0 0 1 0 5.25Zm1.75-.25a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Zm9 9a.25.25 0 0 0-.25.25v3.5c0 .138.112.25.25.25h3.5a.25.25 0 0 0 .25-.25v-3.5a.25.25 0 0 0-.25-.25Z"/>
  </g>
  <text x="818" y="126" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#5fed83">Fix A: Actions UI</text>
  <text x="818" y="146" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="12" fill="#b6bfb8">Trigger from the Actions tab</text>
  <text x="818" y="164" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="12" fill="#b6bfb8">Uses full repo permissions</text>

  <!-- Arrow Fix A -> Run A -->
  <line x1="920" y1="144" x2="982" y2="144" stroke="#5fed83" stroke-width="2" marker-end="url(#arrGreen)"/>

  <!-- Run result A -->
  <rect x="984" y="100" width="168" height="88" rx="10"
        fill="#3fb950" stroke="#3fb950" stroke-width="1.5" data-node="run-a" data-state="done"/>
  <g transform="translate(1004, 118) scale(1.1)" fill="#101411" aria-hidden="true">
    <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm1.5 0a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm10.28-1.72-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018l1.47 1.47 3.97-3.97a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/>
  </g>
  <text x="1068" y="150" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#101411">Run starts</text>
  <text x="1068" y="168" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="12" fill="#101411">No rebuild needed</text>

  <!-- FIX B: new Codespace with devcontainer.json (bottom path) -->
  <rect x="664" y="376" width="256" height="112" rx="10"
        fill="#0a241b" stroke="#909692" stroke-width="2" data-node="fix-b"/>
  <rect x="664" y="376" width="6" height="112" rx="3" fill="#909692"/>
  <text x="792" y="402" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="14" font-weight="700" fill="#f2f5f3">Fix B: New Codespace</text>
  <text x="792" y="422" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="11" fill="#b6bfb8">devcontainer.json grants</text>
  <text x="792" y="440" text-anchor="middle"
        font-family="'Mona Sans Mono', ui-monospace, monospace"
        font-size="11" fill="#b6bfb8">actions:write, workflows:write</text>
  <text x="792" y="460" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="12" fill="#b6bfb8">Requires a fresh rebuild</text>

  <!-- Arrow Fix B -> Run B -->
  <line x1="920" y1="432" x2="982" y2="432" stroke="#909692" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Run result B -->
  <rect x="984" y="376" width="168" height="112" rx="10"
        fill="#3fb950" stroke="#3fb950" stroke-width="1.5" data-node="run-b" data-state="done"/>
  <g transform="translate(1004, 402) scale(1.1)" fill="#101411" aria-hidden="true">
    <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8Zm1.5 0a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm10.28-1.72-4.5 4.5a.75.75 0 0 1-1.06 0l-2-2a.751.751 0 0 1 .018-1.042.751.751 0 0 1 1.042-.018l1.47 1.47 3.97-3.97a.751.751 0 0 1 1.042.018.751.751 0 0 1 .018 1.042Z"/>
  </g>
  <text x="1068" y="434" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="13" font-weight="700" fill="#101411">gh aw run</text>
  <text x="1068" y="452" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="12" fill="#101411">works from terminal</text>

  <!-- Bottom caption -->
  <text x="600" y="530" text-anchor="middle"
        font-family="'Mona Sans', ui-sans-serif, system-ui, sans-serif"
        font-size="13" fill="#909692">Fix A is recommended for the workshop; Fix B is only needed for terminal-based triggers</text>
</svg>
