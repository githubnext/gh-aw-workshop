<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Local setup flow: four sequential steps to set up your local terminal — Verify Git, Install gh CLI, Authenticate, Clone Repo">

  <!-- Background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Title -->
  <text x="600" y="54" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#24292f" text-anchor="middle">Local Terminal Setup Flow</text>

  <!-- Step connectors (arrows) -->
  <!-- Step 1 → Step 2 -->
  <line x1="310" y1="280" x2="376" y2="280" stroke="#d0d7de" stroke-width="3"/>
  <polygon points="376,274 390,280 376,286" fill="#d0d7de"/>
  <!-- Step 2 → Step 3 -->
  <line x1="570" y1="280" x2="636" y2="280" stroke="#d0d7de" stroke-width="3"/>
  <polygon points="636,274 650,280 636,286" fill="#d0d7de"/>
  <!-- Step 3 → Step 4 -->
  <line x1="830" y1="280" x2="896" y2="280" stroke="#d0d7de" stroke-width="3"/>
  <polygon points="896,274 910,280 896,286" fill="#d0d7de"/>

  <!-- Step 1: Verify Git -->
  <rect x="70" y="200" width="240" height="160" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <!-- Badge -->
  <circle cx="70" cy="200" r="18" fill="#0969da"/>
  <text x="70" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <!-- Icon area -->
  <rect x="95" y="215" width="190" height="50" rx="8" fill="#f6f8fa"/>
  <text x="190" y="247" font-family="monospace" font-size="14" fill="#24292f" text-anchor="middle">git --version</text>
  <!-- Label -->
  <text x="190" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Verify Git</text>
  <text x="190" y="318" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">Confirm Git is installed</text>
  <text x="190" y="337" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">and version 2.x+</text>

  <!-- Step 2: Install gh CLI -->
  <rect x="330" y="200" width="240" height="160" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="330" cy="200" r="18" fill="#0969da"/>
  <text x="330" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="355" y="215" width="190" height="50" rx="8" fill="#f6f8fa"/>
  <text x="450" y="247" font-family="monospace" font-size="14" fill="#24292f" text-anchor="middle">gh --version</text>
  <text x="450" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Install gh CLI</text>
  <text x="450" y="318" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">Install GitHub CLI via</text>
  <text x="450" y="337" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">brew, winget, or apt</text>

  <!-- Step 3: Authenticate -->
  <rect x="590" y="200" width="240" height="160" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="590" cy="200" r="18" fill="#0969da"/>
  <text x="590" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="615" y="215" width="190" height="50" rx="8" fill="#f6f8fa"/>
  <text x="710" y="247" font-family="monospace" font-size="14" fill="#24292f" text-anchor="middle">gh auth login</text>
  <text x="710" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Authenticate</text>
  <text x="710" y="318" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">Log in to GitHub.com</text>
  <text x="710" y="337" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">via browser one-time code</text>

  <!-- Step 4: Clone Repo -->
  <rect x="850" y="200" width="280" height="160" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="2"/>
  <circle cx="850" cy="200" r="18" fill="#1a7f37"/>
  <text x="850" y="207" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="875" y="215" width="230" height="50" rx="8" fill="#f6f8fa"/>
  <text x="990" y="247" font-family="monospace" font-size="13" fill="#24292f" text-anchor="middle">gh repo clone my-aw</text>
  <text x="990" y="295" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#24292f" text-anchor="middle">Clone Repo</text>
  <text x="990" y="318" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">Clone your practice repo</text>
  <text x="990" y="337" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">and open in terminal</text>

  <!-- Done chip -->
  <rect x="900" y="388" width="180" height="36" rx="18" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <path d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z" fill="#1a7f37" transform="translate(918 398)"/>
  <text x="1000" y="411" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a7f37" text-anchor="middle">Ready to continue</text>

  <!-- Annotation -->
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="middle">Complete all four steps in order before continuing to the core workshop.</text>

</svg>
