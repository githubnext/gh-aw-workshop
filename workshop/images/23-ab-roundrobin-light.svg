<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
     role="img"
     aria-label="A/B experiment round-robin cycle: five steps gh-aw performs on each workflow run"
     data-visual-kind="diagram"
     data-visual-id="23-ab-roundrobin">
  <title>A/B experiment round-robin cycle: five steps gh-aw performs on each workflow run</title>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="56" text-anchor="middle"
        font-family="'Mona Sans', 'Mona-Sans', system-ui, sans-serif"
        font-size="22" font-weight="700" fill="#101411"
        letter-spacing="0">A/B Experiment Round-Robin Cycle</text>

  <!-- Subtitle annotation -->
  <text x="600" y="80" text-anchor="middle"
        font-family="'Mona Sans', 'Mona-Sans', system-ui, sans-serif"
        font-size="14" font-weight="400" fill="#232925">
    On each run, gh-aw executes these five steps in sequence to assign and record the active variant.
  </text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arr-light" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#08872b"/>
    </marker>
  </defs>

  <!-- Connector arrows -->
  <line x1="228" y1="252" x2="276" y2="252" stroke="#08872b" stroke-width="2.5" marker-end="url(#arr-light)"/>
  <line x1="444" y1="252" x2="492" y2="252" stroke="#08872b" stroke-width="2.5" marker-end="url(#arr-light)"/>
  <line x1="660" y1="252" x2="708" y2="252" stroke="#08872b" stroke-width="2.5" marker-end="url(#arr-light)"/>
  <line x1="876" y1="252" x2="924" y2="252" stroke="#08872b" stroke-width="2.5" marker-end="url(#arr-light)"/>

  <!-- Node 1: Load State -->
  <g data-node="load-state" transform="translate(60,208)">
    <rect width="168" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#08872b"/>
    <text x="20" y="25" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#f2f5f3">1</text>
    <text x="84" y="46" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="17" font-weight="600" fill="#101411">Load State</text>
    <text x="84" y="66" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">artifact counts</text>
  </g>

  <!-- Node 2: Pick Variant -->
  <g data-node="pick-variant" transform="translate(276,208)">
    <rect width="168" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#08872b"/>
    <text x="20" y="25" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#f2f5f3">2</text>
    <text x="84" y="46" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="17" font-weight="600" fill="#101411">Pick Variant</text>
    <text x="84" y="66" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">lowest count wins</text>
  </g>

  <!-- Node 3: Save Counts -->
  <g data-node="save-counts" transform="translate(492,208)">
    <rect width="168" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#08872b"/>
    <text x="20" y="25" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#f2f5f3">3</text>
    <text x="84" y="46" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="17" font-weight="600" fill="#101411">Save Counts</text>
    <text x="84" y="66" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">increment winner</text>
  </g>

  <!-- Node 4: Upload Artifact -->
  <g data-node="upload-artifact" transform="translate(708,208)">
    <rect width="168" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#08872b"/>
    <text x="20" y="25" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#f2f5f3">4</text>
    <text x="84" y="46" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="17" font-weight="600" fill="#101411">Upload Artifact</text>
    <text x="84" y="66" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">publish experiment</text>
  </g>

  <!-- Node 5: Inject Variant -->
  <g data-node="inject-variant" transform="translate(924,208)">
    <rect width="168" height="88" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="20" cy="20" r="14" fill="#08872b"/>
    <text x="20" y="25" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="14" font-weight="700" fill="#f2f5f3">5</text>
    <text x="84" y="46" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="17" font-weight="600" fill="#101411">Inject Variant</text>
    <text x="84" y="66" text-anchor="middle"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">template conditionals</text>
  </g>

  <!-- Example callout -->
  <g transform="translate(300,340)">
    <rect width="600" height="68" rx="10" fill="#e4ebe6" stroke="#b6bfb8" stroke-width="1.5"/>
    <text x="24" y="30"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="15" font-weight="600" fill="#101411">Example: concise ×1 · detailed ×0 → picks detailed</text>
    <text x="24" y="52"
          font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
          font-size="13" font-weight="400" fill="#232925">Lowest invocation count wins; ties go to the first variant listed.</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="470" text-anchor="middle"
        font-family="'Mona Sans','Mona-Sans',system-ui,sans-serif"
        font-size="13" fill="#232925">
    gh-aw selects the variant with the fewest runs so far, keeping all variants evenly tested over time.
  </text>
</svg>
