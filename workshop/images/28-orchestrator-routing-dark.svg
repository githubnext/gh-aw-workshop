<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Diagram: an orchestrator workflow reads repository signals and dispatches exactly one specialist workflow, or logs a summary and exits when no condition matches." data-visual-kind="diagram" data-visual-id="28-orchestrator-routing-dark">
<rect width="1200" height="560" fill="#101411"/>
<text x="40" y="48" font-family="Mona Sans, sans-serif" font-size="24" font-weight="700" fill="#f2f5f3">Orchestrator routing: one specialist per run</text>
<rect data-node="trigger" x="40" y="90" width="190" height="90" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1"/>
<g transform="translate(56,106) scale(1.5)" fill="#b6bfb8" data-node="trigger-icon" aria-hidden="true"><path fill-rule="evenodd" d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16Zm.5-13a.5.5 0 0 0-1 0v5.75c0 .278.223.5.5.5h4.25a.75.75 0 0 0 0-1.5H8.5V3Z"/></g>
<text x="90" y="124" font-family="Mona Sans, sans-serif" font-size="16" font-weight="600" fill="#f2f5f3">Schedule</text>
<text x="56" y="152" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">Daily on weekdays</text>
<circle cx="50" cy="76" r="12" fill="#5fed83"/>
<text x="50" y="80" font-family="Mona Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#101411">1</text>
<rect data-node="orchestrator" x="300" y="80" width="260" height="110" rx="10" fill="#0a241b" stroke="#5fed83" stroke-width="2"/>
<g transform="translate(316,96) scale(1.5)" fill="#5fed83" data-node="orchestrator-icon" aria-hidden="true"><path fill-rule="evenodd" d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.45-1.087a.249.249 0 0 0-.3 0L5.4 15.7a.25.25 0 0 1-.4-.2Z"/></g>
<text x="350" y="114" font-family="Mona Sans, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">repo-orchestrator</text>
<text x="316" y="138" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">Reads open PR age and</text>
<text x="316" y="158" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">status-issue history</text>
<circle cx="310" cy="66" r="12" fill="#5fed83"/>
<text x="310" y="70" font-family="Mona Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#101411">2</text>
<line x1="230" y1="135.0" x2="300" y2="135.0" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-dark)"/>
<text x="600" y="95.0" font-family="Mona Sans Mono, monospace" font-size="14" fill="#b6bfb8">dispatch-workflow</text>
<text x="600" y="113.0" font-family="Mona Sans Mono, monospace" font-size="14" fill="#b6bfb8">(max: 1)</text>
<path d="M 560 135.0 C 650 135.0, 670 110.0, 760 110.0" fill="none" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-dark)"/>
<path d="M 560 135.0 C 650 135.0, 670 270.0, 760 270.0" fill="none" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-dark)"/>
<path d="M 560 135.0 C 650 135.0, 670 430.0, 760 430.0" fill="none" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow-dark)"/>
<rect data-node="pr-reviewer" x="760" y="60" width="400" height="100" rx="10" fill="#0a241b" stroke="#e3b341" stroke-width="2"/>
<g transform="translate(776,76) scale(1.5)" fill="#e3b341" data-node="pr-reviewer-icon" aria-hidden="true"><path fill-rule="evenodd" d="M2.5 1.75a.25.25 0 0 1 .25-.25h8.5a.25.25 0 0 1 .25.25v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25Zm.25-1.75A1.75 1.75 0 0 0 1 1.75v3.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0 0 13 5.25v-3.5A1.75 1.75 0 0 0 11.25 0ZM4 9.5a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Z"/></g>
<text x="810" y="94" font-family="Mona Sans, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Dispatch pr-reviewer</text>
<text x="776" y="118" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">Condition: stale open PRs exist</text>
<rect data-state="in-progress" x="776" y="130" width="110" height="22" rx="11" fill="#e3b341"/>
<text x="831" y="145" font-family="Mona Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#101411">In progress</text>
<circle cx="746" cy="110.0" r="12" fill="#5fed83"/>
<text x="746" y="114.0" font-family="Mona Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#101411">3</text>
<rect data-node="daily-status" x="760" y="220" width="400" height="100" rx="10" fill="#0a241b" stroke="#e3b341" stroke-width="2"/>
<g transform="translate(776,236) scale(1.5)" fill="#e3b341" data-node="daily-status-icon" aria-hidden="true"><path fill-rule="evenodd" d="M2.5 1.75a.25.25 0 0 1 .25-.25h8.5a.25.25 0 0 1 .25.25v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25Zm.25-1.75A1.75 1.75 0 0 0 1 1.75v3.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0 0 13 5.25v-3.5A1.75 1.75 0 0 0 11.25 0ZM4 9.5a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Z"/></g>
<text x="810" y="254" font-family="Mona Sans, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Dispatch daily-status</text>
<text x="776" y="278" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">Condition: no status issue today</text>
<rect data-state="in-progress" x="776" y="290" width="110" height="22" rx="11" fill="#e3b341"/>
<text x="831" y="305" font-family="Mona Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#101411">In progress</text>
<circle cx="746" cy="270.0" r="12" fill="#5fed83"/>
<text x="746" y="274.0" font-family="Mona Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#101411">4</text>
<rect data-node="log-exit" x="760" y="380" width="400" height="100" rx="10" fill="#0a241b" stroke="#8b949e" stroke-width="2"/>
<g transform="translate(776,396) scale(1.5)" fill="#8b949e" data-node="log-exit-icon" aria-hidden="true"><path fill-rule="evenodd" d="M2.5 1.75a.25.25 0 0 1 .25-.25h8.5a.25.25 0 0 1 .25.25v3.5a.25.25 0 0 1-.25.25h-8.5a.25.25 0 0 1-.25-.25Zm.25-1.75A1.75 1.75 0 0 0 1 1.75v3.5c0 .966.784 1.75 1.75 1.75h8.5A1.75 1.75 0 0 0 13 5.25v-3.5A1.75 1.75 0 0 0 11.25 0ZM4 9.5a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Zm4 0a1 1 0 1 0-2 0 1 1 0 0 0 2 0Z"/></g>
<text x="810" y="414" font-family="Mona Sans, sans-serif" font-size="16" font-weight="700" fill="#f2f5f3">Log summary and exit</text>
<text x="776" y="438" font-family="Mona Sans, sans-serif" font-size="14" fill="#b6bfb8">Condition: neither matched</text>
<rect data-state="draft" x="776" y="450" width="80" height="22" rx="11" fill="#8b949e"/>
<text x="816" y="465" font-family="Mona Sans, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#101411">Skipped</text>
<circle cx="746" cy="430.0" r="12" fill="#5fed83"/>
<text x="746" y="434.0" font-family="Mona Sans Mono, monospace" font-size="13" font-weight="700" text-anchor="middle" fill="#101411">5</text>
<text x="40" y="530" font-family="Mona Sans, sans-serif" font-size="15" fill="#b6bfb8">The orchestrator dispatches at most one specialist workflow per run, or logs a summary when no condition matches.</text>
<defs><marker id="arrow-dark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#b6bfb8"/></marker></defs>
</svg>