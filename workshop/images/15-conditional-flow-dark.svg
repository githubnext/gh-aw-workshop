<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="Conditional logic flow: shell step writes commit count to GITHUB_OUTPUT, the if condition evaluates it, then either skips or runs the agent job"
  data-visual-kind="diagram"
  data-visual-id="15-conditional-flow-dark">

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#b6bfb8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Title -->
  <text x="600" y="44" font-family="'Mona Sans',system-ui,sans-serif" font-size="20" font-weight="700" fill="#f2f5f3" text-anchor="middle">Conditional Logic Flow</text>
  <text x="600" y="70" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" fill="#b6bfb8" text-anchor="middle">How a deterministic shell step gates the agentic job</text>

  <!-- Step badges -->
  <circle cx="130" cy="100" r="14" fill="#5fed83"/>
  <text x="130" y="105" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">1</text>
  <text x="130" y="122" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">Gather context</text>

  <circle cx="450" cy="100" r="14" fill="#5fed83"/>
  <text x="450" y="105" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">2</text>
  <text x="450" y="122" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">Expose as output</text>

  <circle cx="760" cy="100" r="14" fill="#5fed83"/>
  <text x="760" y="105" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="700" fill="#101411" text-anchor="middle">3</text>
  <text x="760" y="122" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">Evaluate condition</text>

  <!-- Shell Step node -->
  <rect x="30" y="145" width="200" height="120" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="shell-step"/>
  <rect x="30" y="145" width="200" height="36" rx="8" fill="#5fed83"/>
  <rect x="30" y="163" width="200" height="18" fill="#5fed83"/>
  <text x="130" y="168" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#101411" text-anchor="middle">Shell Step</text>
  <text x="130" y="198" font-family="'Mona Sans Mono',monospace" font-size="14" fill="#f2f5f3" text-anchor="middle">git log --since="24h"</text>
  <text x="130" y="218" font-family="'Mona Sans Mono',monospace" font-size="14" fill="#f2f5f3" text-anchor="middle">| wc -l</text>
  <text x="130" y="244" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">id: recent</text>

  <!-- Arrow 1 -->
  <line x1="230" y1="205" x2="308" y2="205" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- GITHUB_OUTPUT box -->
  <rect x="310" y="160" width="200" height="88" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="github-output"/>
  <rect x="310" y="160" width="200" height="32" rx="8" fill="#232925"/>
  <rect x="310" y="178" width="200" height="14" fill="#232925"/>
  <text x="410" y="181" font-family="'Mona Sans Mono',monospace" font-size="14" font-weight="600" fill="#b6bfb8" text-anchor="middle">$GITHUB_OUTPUT</text>
  <text x="410" y="214" font-family="'Mona Sans Mono',monospace" font-size="16" fill="#5fed83" text-anchor="middle">commit_count=3</text>
  <text x="410" y="237" font-family="'Mona Sans',system-ui,sans-serif" font-size="13" fill="#b6bfb8" text-anchor="middle">steps.recent.outputs.commit_count</text>

  <!-- Arrow 2 -->
  <line x1="510" y1="205" x2="618" y2="205" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- if: condition diamond -->
  <polygon points="760,148 882,205 760,262 638,205" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="if-condition"/>
  <text x="760" y="199" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#f2f5f3" text-anchor="middle">if: condition</text>
  <text x="760" y="220" font-family="'Mona Sans Mono',monospace" font-size="14" fill="#5fed83" text-anchor="middle">count != '0'</text>

  <!-- Arrow true → agent job -->
  <line x1="882" y1="205" x2="960" y2="205" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="921" y="196" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#5fed83" text-anchor="middle">true</text>

  <!-- Agent job box -->
  <rect x="962" y="155" width="200" height="100" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="agent-job-runs"/>
  <rect x="962" y="155" width="200" height="34" rx="8" fill="#3fb950" data-state="done"/>
  <rect x="962" y="171" width="200" height="18" fill="#3fb950"/>
  <text x="1062" y="177" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#101411" text-anchor="middle">Agent Job Runs</text>
  <text x="1062" y="208" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#f2f5f3" text-anchor="middle">AI processes commits</text>
  <text x="1062" y="228" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#f2f5f3" text-anchor="middle">and posts report</text>

  <!-- Arrow false → skip box -->
  <line x1="760" y1="262" x2="760" y2="338" stroke="#b6bfb8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="772" y="305" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="start">false</text>

  <!-- Skip box -->
  <rect x="640" y="340" width="240" height="90" rx="8" fill="#0a241b" stroke="#909692" stroke-width="1.5" data-node="agent-job-skipped"/>
  <rect x="640" y="340" width="240" height="34" rx="8" fill="#8b949e" data-state="skipped"/>
  <rect x="640" y="356" width="240" height="18" fill="#8b949e"/>
  <text x="760" y="362" font-family="'Mona Sans',system-ui,sans-serif" font-size="16" font-weight="600" fill="#f2f5f3" text-anchor="middle">Agent Job Skipped</text>
  <text x="760" y="394" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">No commits — no report</text>
  <text x="760" y="414" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">saves AI tokens</text>

  <!-- Bottom annotation -->
  <text x="600" y="490" font-family="'Mona Sans',system-ui,sans-serif" font-size="14" fill="#b6bfb8" text-anchor="middle">Deterministic steps run first; the agent job is gated by the evaluated output value.</text>

</svg>
