<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="Hybrid pattern diagram showing three stages: deterministic jobs fetch and transform data, structured outputs pass to the workflow body, and the agent handles interpretation and communication"
  data-visual-kind="diagram"
  data-visual-id="sq0501-hybrid-pattern">
  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-family="'Mona Sans', system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#f2f5f3">Hybrid Pattern: Deterministic Steps + Agent Reasoning</text>
  <text x="600" y="66" text-anchor="middle" font-family="'Mona Sans', system-ui, -apple-system, sans-serif" font-size="14" fill="#b6bfb8">Keep deterministic guardrails where you need them — let the agent handle context-heavy decisions</text>

  <!-- Stage 1: Deterministic Jobs -->
  <g data-node="deterministic-steps">
    <rect x="60" y="120" width="300" height="330" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <!-- Stage badge -->
    <rect x="80" y="108" width="22" height="22" rx="11" fill="#5fed83"/>
    <text x="91" y="124" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#101411">1</text>
    <!-- Stage label -->
    <text x="210" y="156" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">Deterministic Steps</text>
    <text x="210" y="176" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">fetch · transform · validate</text>
    <line x1="80" y1="190" x2="340" y2="190" stroke="#909692" stroke-width="1"/>

    <!-- Step chips in stage 1 -->
    <rect x="90" y="206" width="240" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="210" y="229" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="13" fill="#f2f5f3">gh api /repos/.../issues</text>

    <rect x="90" y="254" width="240" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="210" y="277" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="13" fill="#f2f5f3">jq &#39;.[] | {title, labels}&#39;</text>

    <rect x="90" y="302" width="240" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="210" y="322" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="13" fill="#f2f5f3">echo &quot;issues=$DATA&quot;</text>
    <text x="210" y="337" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="11" fill="#b6bfb8">&gt;&gt; $GITHUB_OUTPUT</text>

    <!-- Deterministic tag -->
    <rect x="110" y="366" width="200" height="28" rx="14" fill="#0a241b" stroke="#5fed83" stroke-width="1"/>
    <text x="210" y="385" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#5fed83">Reproducible · Fast · Cheap</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="360" y1="285" x2="440" y2="285" stroke="#5fed83" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="440,279 455,285 440,291" fill="#5fed83"/>
  <!-- Arrow label -->
  <rect x="370" y="255" width="70" height="22" rx="4" fill="#0a241b"/>
  <text x="405" y="270" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#5fed83">structured</text>
  <text x="405" y="305" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#5fed83">output</text>

  <!-- Stage 2: Structured Outputs -->
  <g data-node="structured-outputs">
    <rect x="455" y="120" width="290" height="330" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <rect x="475" y="108" width="22" height="22" rx="11" fill="#5fed83"/>
    <text x="486" y="124" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#101411">2</text>
    <text x="600" y="156" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">Structured Outputs</text>
    <text x="600" y="176" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">bridging deterministic → agentic</text>
    <line x1="475" y1="190" x2="725" y2="190" stroke="#909692" stroke-width="1"/>

    <!-- Output box -->
    <rect x="475" y="206" width="250" height="130" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="600" y="228" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#b6bfb8">GITHUB_OUTPUT</text>
    <text x="600" y="252" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="13" fill="#5fed83">issues=[</text>
    <text x="600" y="270" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#f2f5f3">  {title: &quot;Auth bug&quot;,</text>
    <text x="600" y="287" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#f2f5f3">   labels: [&quot;bug&quot;]},</text>
    <text x="600" y="304" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#f2f5f3">  ...</text>
    <text x="600" y="326" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="12" fill="#5fed83">]</text>

    <rect x="500" y="360" width="200" height="56" rx="6" fill="#0a241b" stroke="#909692" stroke-width="1"/>
    <text x="600" y="378" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f2f5f3">Workflow body reads this</text>
    <text x="600" y="396" text-anchor="middle" font-family="'Mona Sans Mono', monospace" font-size="11" fill="#f2f5f3">$&#123;&#123; steps.fetch.outputs.issues &#125;&#125;</text>
    <text x="600" y="411" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#b6bfb8">via templating</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="745" y1="285" x2="825" y2="285" stroke="#5fed83" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="825,279 840,285 825,291" fill="#5fed83"/>
  <rect x="754" y="255" width="63" height="22" rx="4" fill="#0a241b"/>
  <text x="785" y="270" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#5fed83">agent</text>
  <text x="785" y="305" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#5fed83">reasoning</text>

  <!-- Stage 3: Agent -->
  <g data-node="agent-reasoning">
    <rect x="840" y="120" width="300" height="330" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <rect x="860" y="108" width="22" height="22" rx="11" fill="#5fed83"/>
    <text x="871" y="124" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#101411">3</text>
    <text x="990" y="156" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">Agent Reasoning</text>
    <text x="990" y="176" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">interpret · prioritize · communicate</text>
    <line x1="860" y1="190" x2="1120" y2="190" stroke="#909692" stroke-width="1"/>

    <!-- Agent tasks -->
    <rect x="865" y="206" width="250" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="990" y="229" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#f2f5f3">Triage and prioritize issues</text>

    <rect x="865" y="254" width="250" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="990" y="277" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#f2f5f3">Apply labels with reasoning</text>

    <rect x="865" y="302" width="250" height="36" rx="6" fill="#101411" stroke="#909692" stroke-width="1"/>
    <text x="990" y="325" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#f2f5f3">Draft summaries &amp; comments</text>

    <!-- Agentic tag -->
    <rect x="890" y="366" width="200" height="28" rx="14" fill="#0a241b" stroke="#5fed83" stroke-width="1"/>
    <text x="990" y="385" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#5fed83">Flexible · Handles ambiguity</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="506" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#b6bfb8">Platform teams preserve deterministic guardrails for stable data ops while the agent handles context-heavy decisions — reducing fragile shell branching.</text>

  <!-- Dashed grouping around all 3 stages -->
  <rect x="40" y="100" width="1120" height="370" rx="12" fill="none" stroke="#909692" stroke-width="1" stroke-dasharray="8,4"/>
</svg>
