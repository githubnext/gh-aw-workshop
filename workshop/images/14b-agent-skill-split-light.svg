<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="PR reviewer agent and skill split: a pull request event triggers the parent brief, which calls the pr-reviewer agent; the agent applies the pr-review-standards skill, returns findings to the parent, and the parent submits a safe-output review" data-visual-kind="diagram" data-visual-id="14b-agent-skill-split">
  <!-- Icons: Primer Octicons, MIT License, Copyright GitHub, Inc. -->
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#232925"/>
    </marker>
    <marker id="arr-ret" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#08872b"/>
    </marker>
    <marker id="arr-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0550ae"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="38" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="20" font-weight="700" fill="#101411">PR Reviewer: Agent and Skill Split</text>
  <text x="600" y="60" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="14" font-weight="400" fill="#232925">Each layer has one responsibility — coordinate, investigate, or define quality</text>

  <!-- ── TRIGGER node ── -->
  <g data-node="trigger" data-state="open">
    <rect x="40" y="140" width="160" height="108" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <rect x="40" y="140" width="160" height="36" rx="10" fill="#dff7e9"/>
    <rect x="40" y="158" width="160" height="18" fill="#dff7e9"/>
    <!-- clock octicon (16px) -->
    <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7-3.25v2.992l2.028.812a.75.75 0 0 1-.557 1.392l-2.5-1A.751.751 0 0 1 7 8.25v-3.5a.75.75 0 0 1 1.5 0Z" fill="#1a7f37" transform="translate(46 146) scale(0.85)"/>
    <text x="120" y="163" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#1a7f37">PR Event</text>
    <text x="120" y="194" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">ready_for_review</text>
    <text x="120" y="212" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">or /review</text>
    <text x="120" y="230" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#232925">slash command</text>
  </g>

  <!-- arrow: trigger → parent -->
  <line x1="200" y1="194" x2="262" y2="194" stroke="#232925" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── PARENT BRIEF box ── -->
  <g data-node="parent-brief">
    <rect x="263" y="110" width="192" height="168" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <rect x="263" y="110" width="192" height="36" rx="10" fill="#ddf4ff"/>
    <rect x="263" y="128" width="192" height="18" fill="#ddf4ff"/>
    <text x="359" y="133" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0550ae">Parent Brief</text>
    <text x="359" y="163" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Identifies the PR</text>
    <text x="359" y="181" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Calls pr-reviewer</text>
    <text x="359" y="199" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Submits result</text>
    <!-- role tag -->
    <rect x="291" y="218" width="136" height="24" rx="12" fill="#ddf4ff" stroke="#0550ae" stroke-width="1"/>
    <text x="359" y="234" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="11" fill="#0550ae">orchestrates</text>
  </g>

  <!-- arrow: parent → agent -->
  <line x1="455" y1="194" x2="517" y2="194" stroke="#232925" stroke-width="2" marker-end="url(#arr)"/>
  <text x="486" y="186" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#232925">calls</text>

  <!-- ── AGENT region ── -->
  <rect x="518" y="88" width="290" height="280" rx="10" fill="#fffbdd" stroke="#b6bfb8" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="663" y="110" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#232925">inline agent</text>

  <!-- pr-reviewer agent node -->
  <g data-node="pr-reviewer-agent">
    <rect x="534" y="120" width="258" height="110" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <rect x="534" y="120" width="258" height="36" rx="10" fill="#fffbdd"/>
    <rect x="534" y="138" width="258" height="18" fill="#fffbdd"/>
    <text x="663" y="143" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#9a6700">pr-reviewer agent</text>
    <text x="663" y="173" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Reads the diff</text>
    <text x="663" y="191" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Applies review skill</text>
    <!-- role tag -->
    <rect x="591" y="208" width="144" height="24" rx="12" fill="#fffbdd" stroke="#9a6700" stroke-width="1"/>
    <text x="663" y="224" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="11" fill="#9a6700">investigates</text>
  </g>

  <!-- arrow: agent → skill -->
  <line x1="663" y1="230" x2="663" y2="268" stroke="#0550ae" stroke-width="1.5" marker-end="url(#arr-blue)" stroke-dasharray="4 2"/>
  <text x="680" y="255" text-anchor="start" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#0550ae">applies</text>

  <!-- pr-review-standards skill node -->
  <g data-node="pr-review-standards-skill">
    <rect x="534" y="270" width="258" height="80" rx="10" fill="#ffffff" stroke="#0550ae" stroke-width="1.5"/>
    <rect x="534" y="270" width="258" height="30" rx="10" fill="#ddf4ff"/>
    <rect x="534" y="282" width="258" height="18" fill="#ddf4ff"/>
    <text x="663" y="289" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0550ae">pr-review-standards skill</text>
    <text x="663" y="320" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Defines quality criteria</text>
    <text x="663" y="338" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">Cite file + line for every finding</text>
  </g>

  <!-- arrow: agent → parent (findings return) -->
  <line x1="808" y1="175" x2="880" y2="175" stroke="#08872b" stroke-width="2" marker-end="url(#arr-ret)"/>
  <text x="844" y="165" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#08872b">findings</text>

  <!-- ── SAFE OUTPUT box ── -->
  <g data-node="safe-output">
    <rect x="880" y="130" width="198" height="132" rx="10" fill="#ffffff" stroke="#08872b" stroke-width="2"/>
    <rect x="880" y="130" width="198" height="36" rx="10" fill="#dff7e9"/>
    <rect x="880" y="148" width="198" height="18" fill="#dff7e9"/>
    <text x="979" y="153" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" font-weight="700" fill="#08872b">Safe Output</text>
    <text x="979" y="183" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">submit-pull-request-</text>
    <text x="979" y="201" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925">review</text>
    <!-- tag: max:1, COMMENT or REQUEST_CHANGES -->
    <rect x="900" y="218" width="158" height="24" rx="12" fill="#dff7e9" stroke="#08872b" stroke-width="1"/>
    <text x="979" y="234" text-anchor="middle" font-family="Mona Sans Mono, monospace" font-size="11" fill="#08872b">max: 1 · controlled write</text>
  </g>

  <!-- arrow: safe output → PR Review posted -->
  <line x1="1078" y1="194" x2="1130" y2="194" stroke="#232925" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ── PR Review posted ── -->
  <g data-node="pr-review" data-state="open">
    <rect x="1130" y="150" width="50" height="88" rx="8" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <!-- git-pull-request octicon path -->
    <path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z" fill="#1a7f37" transform="translate(1133 158) scale(1.3)"/>
    <text x="1155" y="222" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#232925">Review</text>
    <text x="1155" y="234" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="11" fill="#232925">posted</text>
  </g>

  <!-- ── Separation label callouts ── -->
  <!-- layer label: parent brief -->
  <text x="359" y="98" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925" font-weight="600">1 — Coordinate</text>
  <!-- layer label: agent+skill region -->
  <text x="663" y="76" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925" font-weight="600">2 — Investigate (reusable)</text>
  <!-- layer label: safe output -->
  <text x="979" y="118" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="12" fill="#232925" font-weight="600">3 — Controlled Write</text>

  <!-- Bottom annotation -->
  <text x="600" y="490" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#232925">Update the skill to change review quality. Update the agent to change how it investigates. Update the parent to change orchestration.</text>
  <text x="600" y="510" text-anchor="middle" font-family="Mona Sans, system-ui, sans-serif" font-size="13" fill="#232925">Each layer changes independently without breaking the others.</text>
</svg>
