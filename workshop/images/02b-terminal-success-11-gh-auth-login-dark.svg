<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Example prompt flow after running `gh auth login`">
  <!-- Dark theme: page #0d1117, panel #161b22, border #30363d -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <!-- Browser chrome -->
  <rect x="60" y="20" width="1080" height="44" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">github.com/your-org/gh-aw-workshop/actions</text>
  <!-- Terminal window -->
  <rect x="60" y="80" width="1080" height="380" rx="12" fill="#010409" stroke="#30363d" stroke-width="1.5"/>
  <!-- Terminal title bar -->
  <rect x="60" y="80" width="1080" height="36" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="98" width="1080" height="18" fill="#161b22"/>
  <circle cx="92" cy="98" r="6" fill="#ff5f57"/>
  <circle cx="112" cy="98" r="6" fill="#febc2e"/>
  <circle cx="132" cy="98" r="6" fill="#28c840"/>
  <text x="600" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#8b949e">Terminal</text>
  <!-- Terminal content -->
  <text x="100" y="152" font-family="monospace" font-size="15" fill="#7ee787">student@machine:~/gh-aw-workshop$</text>
  <text x="100" y="152" font-family="monospace" font-size="15" fill="#c9d1d9" dx="302"> gh auth login</text>
  <text x="100" y="178" font-family="monospace" font-size="15" fill="#c9d1d9">? What account do you want to log into? GitHub.com</text>
  <text x="100" y="202" font-family="monospace" font-size="15" fill="#c9d1d9">? How would you like to authenticate?  Login with a web browser</text>
  <text x="100" y="226" font-family="monospace" font-size="15" fill="#e3b341">! First copy your one-time code: ABCD-1234</text>
  <text x="100" y="250" font-family="monospace" font-size="15" fill="#c9d1d9">Press Enter to open github.com in your browser...</text>
  <text x="100" y="286" font-family="monospace" font-size="15" fill="#7ee787">✓ Authentication complete.</text>
  <text x="100" y="310" font-family="monospace" font-size="15" fill="#7ee787">✓ Logged in as your-username</text>
  <text x="100" y="346" font-family="monospace" font-size="15" fill="#7ee787">student@machine:~/gh-aw-workshop$</text>
  <!-- Success annotation badge -->
  <rect x="820" y="158" width="160" height="32" rx="6" fill="#1a7f37"/>
  <path d="M13.78 4.22a.75.75 0 0 1 0 1.06l-7.25 7.25a.75.75 0 0 1-1.06 0L2.22 9.28a.75.75 0 0 1 1.06-1.06L6 10.94l6.72-6.72a.75.75 0 0 1 1.06 0Z" fill="#ffffff" transform="translate(839 166)"/>
  <text x="910" y="178" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">Success output</text>
  <line x1="820" y1="174" x2="730" y2="174" stroke="#1a7f37" stroke-width="2"/>
  <!-- Bottom annotation -->
  <text x="600" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#8b949e">Example prompt flow after running `gh auth login`</text>
</svg>
