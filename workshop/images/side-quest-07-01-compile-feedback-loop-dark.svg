<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"
  role="img"
  aria-label="The gh aw compile feedback loop: edit the workflow source file, run gh aw compile, check whether it compiled cleanly, then either get a generated lock file or read the reported error and fix it before re-running compile."
  data-visual-kind="diagram"
  data-visual-id="side-quest-07-01-compile-feedback-loop">

  <!-- Background -->
  <rect width="1200" height="560" fill="#101411"/>

  <!-- Main card -->
  <rect x="30" y="20" width="1140" height="520" rx="12" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>

  <!-- Title -->
  <text x="600" y="54" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="22" font-weight="700" fill="#f2f5f3">
    The gh aw compile Feedback Loop
  </text>
  <text x="600" y="78" text-anchor="middle"
    font-family="'Mona Sans', system-ui, -apple-system, sans-serif"
    font-size="14" fill="#b6bfb8">
    Compile after every edit to catch structure errors before you run the workflow.
  </text>

  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fed83"/>
    </marker>
    <marker id="arrow-danger-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f85149"/>
    </marker>
  </defs>

  <!-- NODE 1: Edit source -->
  <g data-node="edit-source">
    <rect x="60" y="160" width="200" height="110" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <text x="160" y="190" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">① Edit source</text>
    <text x="160" y="214" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">Change frontmatter or</text>
    <text x="160" y="231" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">the Markdown body</text>
    <text x="160" y="254" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">daily-report-status.md</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="262" y1="215" x2="316" y2="215" stroke="#5fed83" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- NODE 2: Run compile -->
  <g data-node="run-compile">
    <rect x="320" y="160" width="200" height="110" rx="10" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <text x="420" y="190" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">② Run compile</text>
    <text x="420" y="214" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">Validate structure</text>
    <text x="420" y="231" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">before you commit</text>
    <text x="420" y="254" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">gh aw compile</text>
  </g>

  <!-- Connector: compile -> flags group -->
  <line x1="420" y1="271" x2="420" y2="298" stroke="#909692" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Flags group (dashed grouping) -->
  <g data-node="compile-flags">
    <rect x="320" y="300" width="200" height="140" rx="10" fill="none" stroke="#909692" stroke-width="1.5" stroke-dasharray="6,5"/>
    <text x="420" y="320" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#b6bfb8">Compile flags</text>
    <text x="420" y="345" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">--no-emit</text>
    <text x="420" y="363" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#b6bfb8">quick structure check</text>
    <text x="420" y="386" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">--watch</text>
    <text x="420" y="404" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="11" fill="#b6bfb8">compile on every save</text>
    <text x="420" y="424" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">--validate</text>
  </g>

  <!-- Arrow 2 -> decision -->
  <line x1="522" y1="215" x2="576" y2="215" stroke="#5fed83" stroke-width="2.5" marker-end="url(#arrow-dark)"/>

  <!-- NODE 3: Decision diamond -->
  <g data-node="compiled-cleanly">
    <polygon points="680,150 780,215 680,280 580,215" fill="#0a241b" stroke="#909692" stroke-width="1.5"/>
    <text x="680" y="211" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f2f5f3">Compiled</text>
    <text x="680" y="227" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f2f5f3">cleanly?</text>
  </g>

  <!-- Arrow decision -> success (Yes) -->
  <line x1="782" y1="215" x2="836" y2="215" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <text x="809" y="202" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#3fb950">Yes</text>

  <!-- NODE 4: Success - lock file -->
  <g data-node="lock-file-ready" data-state="done">
    <rect x="840" y="160" width="250" height="110" rx="10" fill="#0a241b" stroke="#3fb950" stroke-width="2"/>
    <rect x="840" y="160" width="250" height="6" fill="#3fb950"/>
    <text x="965" y="192" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">③ Lock file ready</text>
    <text x="965" y="216" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">GitHub Actions can now</text>
    <text x="965" y="233" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">run the workflow</text>
    <text x="965" y="255" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">.lock.yml generated</text>
  </g>

  <!-- Arrow decision -> error (No) -->
  <line x1="680" y1="282" x2="680" y2="336" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrow-danger-dark)"/>
  <text x="706" y="312" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f85149">No</text>

  <!-- NODE 5: Error - fix line -->
  <g data-node="fix-the-error" data-state="error">
    <rect x="580" y="340" width="250" height="110" rx="10" fill="#0a241b" stroke="#f85149" stroke-width="2"/>
    <rect x="580" y="340" width="250" height="6" fill="#f85149"/>
    <text x="705" y="372" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5f3">④ Fix the error</text>
    <text x="705" y="396" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">Check the line above or</text>
    <text x="705" y="413" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" fill="#b6bfb8">below the reported number</text>
    <text x="705" y="435" text-anchor="middle" font-family="'Mona Sans Mono', ui-monospace, monospace" font-size="11" fill="#f2f5f3">first error line</text>
  </g>

  <!-- Loop-back arrow: fix -> edit source -->
  <path d="M580,450 L580,490 L160,490 L160,272" fill="none" stroke="#f85149" stroke-width="2.5" marker-end="url(#arrow-danger-dark)"/>
  <text x="370" y="505" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#f85149">Fix and re-run compile</text>

  <!-- Caption -->
  <text x="600" y="530" text-anchor="middle" font-family="'Mona Sans', system-ui, sans-serif" font-size="13" fill="#b6bfb8">
    Reading direction: left to right, then loop back on failure until the compile succeeds.
  </text>
</svg>
