<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Sample daily repository status report generated by the finished workflow">
  <!-- Browser chrome -->
  <rect width="1200" height="560" fill="#0d1117"/>
  <rect x="70" y="20" width="1060" height="520" rx="18" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M70 38c0-9.941 8.059-18 18-18h1024c9.941 0 18 8.059 18 18v26H70V38z" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="102" cy="45" r="6" fill="#30363d"/>
  <circle cx="126" cy="45" r="6" fill="#30363d"/>
  <circle cx="150" cy="45" r="6" fill="#30363d"/>
  <rect x="210" y="32" width="540" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
  <text x="230" y="47" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">github.com/your-org/your-repo/issues/42#issuecomment</text>
  <!-- Nav tabs -->
  <line x1="70" y1="82" x2="1130" y2="82" stroke="#30363d" stroke-width="1"/>
  <g font-family="Arial, sans-serif" font-size="14" fill="#8b949e">
    <text x="120" y="106">Code</text>
    <text x="200" y="106">Issues</text>
    <text x="295" y="106" fill="#f0f6fc">Pull requests</text>
    <text x="430" y="106">Actions</text>
  </g>
  <!-- Comment panel -->
  <rect x="100" y="120" width="1000" height="360" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Comment header -->
  <rect x="100" y="120" width="1000" height="40" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="100" y="148" width="1000" height="12" fill="#161b22"/>
  <text x="120" y="147" font-family="Arial, sans-serif" font-size="13" fill="#8b949e">gh-aw-bot commented just now</text>
  <!-- Comment body - terminal output -->
  <rect x="120" y="170" width="960" height="290" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="140" y="200" font-family="monospace" font-size="14" fill="#c9d1d9">📊 Daily Repo Status — 2025-07-10</text>
  <text x="140" y="222" font-family="monospace" font-size="13" fill="#6e7681">══════════════════════════════════════</text>
  <text x="140" y="248" font-family="monospace" font-size="14" fill="#f0f6fc">🔀 Open pull requests:  3</text>
  <text x="140" y="272" font-family="monospace" font-size="14" fill="#f0f6fc">🐛 Open issues:         7  (2 labeled "bug")</text>
  <text x="140" y="296" font-family="monospace" font-size="14" fill="#3fb950">✅ CI status:           passing</text>
  <text x="140" y="320" font-family="monospace" font-size="14" fill="#f0f6fc">📝 Last commit:         "Fix login timeout" — 6 hours ago</text>
  <text x="140" y="344" font-family="monospace" font-size="14" fill="#f0f6fc">💬 New discussion:      "RFC: Add dark mode" — 14 replies</text>
  <text x="140" y="380" font-family="monospace" font-size="14" fill="#f0f6fc">Everything looks healthy. One PR has been open for</text>
  <text x="140" y="402" font-family="monospace" font-size="14" fill="#f0f6fc">14 days and might need a nudge. 👀</text>
  <text x="140" y="442" font-family="monospace" font-size="12" fill="#6e7681">Generated by daily-report-status agentic workflow · 2025-07-10T06:00:00Z</text>
  <!-- Annotation -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#8b949e">Sample daily repository status report generated by the finished workflow</text>
</svg>
