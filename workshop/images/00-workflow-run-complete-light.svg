<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Preview of a completed workflow run in the Actions tab">
  <!-- Page background -->
  <rect width="1200" height="560" fill="#f6f8fa"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#ffffff"/>
  <circle cx="24" cy="22" r="6" fill="#d0d7de"/>
  <circle cx="48" cy="22" r="6" fill="#d0d7de"/>
  <circle cx="72" cy="22" r="6" fill="#d0d7de"/>
  <rect x="220" y="8" width="760" height="28" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="27" font-family="Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">github.com/your-org/your-repo/actions</text>

  <!-- Nav tab bar -->
  <rect x="0" y="44" width="1200" height="48" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="75" font-family="Arial, sans-serif" font-size="15" fill="#57606a">Code</text>
  <text x="160" y="75" font-family="Arial, sans-serif" font-size="15" fill="#57606a">Issues</text>
  <text x="260" y="75" font-family="Arial, sans-serif" font-size="15" fill="#57606a">Pull requests</text>
  <text x="420" y="75" font-family="Arial, sans-serif" font-size="15" fill="#24292f" font-weight="bold">Actions</text>
  <rect x="418" y="88" width="64" height="3" fill="#0969da" rx="2"/>

  <!-- Main content -->
  <rect x="60" y="110" width="1080" height="380" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Run title row -->
  <circle cx="104" cy="160" r="18" fill="#1a7f37"/>
  <text x="96" y="167" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">✓</text>
  <text x="136" y="156" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#24292f">Daily Repo Status</text>
  <text x="136" y="180" font-family="Arial, sans-serif" font-size="14" fill="#57606a">Run #42 completed successfully · 52s · triggered manually</text>

  <!-- Divider -->
  <line x1="80" y1="202" x2="1120" y2="202" stroke="#d0d7de" stroke-width="1"/>

  <!-- Jobs section header -->
  <text x="100" y="232" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#24292f">Jobs</text>

  <!-- Job rows -->
  <rect x="80" y="244" width="1040" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="266" r="12" fill="#1a7f37"/>
  <text x="110" y="272" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓</text>
  <text x="142" y="272" font-family="Arial, sans-serif" font-size="16" fill="#24292f">activating</text>
  <text x="1068" y="272" font-family="Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="end">6s</text>

  <rect x="80" y="294" width="1040" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="316" r="12" fill="#1a7f37"/>
  <text x="110" y="322" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓</text>
  <text x="142" y="322" font-family="Arial, sans-serif" font-size="16" fill="#24292f">agent</text>
  <text x="1068" y="322" font-family="Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="end">17s</text>

  <rect x="80" y="344" width="1040" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="366" r="12" fill="#1a7f37"/>
  <text x="110" y="372" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓</text>
  <text x="142" y="372" font-family="Arial, sans-serif" font-size="16" fill="#24292f">safe_outputs</text>
  <text x="1068" y="372" font-family="Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="end">9s</text>

  <rect x="80" y="394" width="1040" height="44" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="416" r="12" fill="#1a7f37"/>
  <text x="110" y="422" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">✓</text>
  <text x="142" y="422" font-family="Arial, sans-serif" font-size="16" fill="#24292f">conclusion</text>
  <text x="1068" y="422" font-family="Arial, sans-serif" font-size="14" fill="#57606a" text-anchor="end">12s</text>

  <!-- Annotation -->
  <text x="600" y="524" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#57606a">Preview of a completed workflow run in the Actions tab</text>
</svg>
