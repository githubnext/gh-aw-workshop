<svg xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 560"
  width="1200" height="560"
  role="img"
  aria-label="Research-driven training node pipeline: five stages from signal review to pull request"
  data-visual-kind="diagram"
  data-visual-id="19-research-pipeline">

  <style>
    text { font-family: 'Mona Sans', system-ui, sans-serif; }
    .mono { font-family: 'Mona Sans Mono', ui-monospace, monospace; }
    .title { font-size: 20px; font-weight: 600; fill: #101411; }
    .caption { font-size: 15px; fill: #232925; }
    .node-label { font-size: 17px; font-weight: 600; fill: #101411; }
    .node-sub { font-size: 14px; fill: #232925; }
    .badge { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .arrow-label { font-size: 13px; fill: #232925; }
  </style>

  <!-- Background -->
  <rect width="1200" height="560" fill="#f2f5f3"/>

  <!-- Title -->
  <text x="600" y="48" class="title" text-anchor="middle">Research-Driven Training Node Pipeline</text>

  <!-- Arrow connector helper: we'll draw arrows between nodes manually -->

  <!-- Node 1: Review Signals -->
  <g data-node="review-signals">
    <rect x="48" y="120" width="188" height="140" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <!-- Badge -->
    <circle cx="80" cy="120" r="16" fill="#08872b"/>
    <text x="80" y="125" class="badge" text-anchor="middle">1</text>
    <!-- Icon: clock (schedule) -->
    <circle cx="142" cy="168" r="22" fill="none" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="142" cy="168" r="2.5" fill="#08872b"/>
    <line x1="142" y1="168" x2="142" y2="154" stroke="#08872b" stroke-width="2"/>
    <line x1="142" y1="168" x2="153" y2="168" stroke="#08872b" stroke-width="2"/>
    <text x="142" y="210" class="node-label" text-anchor="middle">Review Signals</text>
    <text x="142" y="230" class="node-sub" text-anchor="middle">Fetch LLMs.txt</text>
    <text x="142" y="248" class="node-sub" text-anchor="middle">from gh-aw repo</text>
  </g>

  <!-- Arrow 1→2 -->
  <line x1="238" y1="190" x2="278" y2="190" stroke="#b6bfb8" stroke-width="2.5"/>
  <polygon points="278,184 290,190 278,196" fill="#b6bfb8"/>

  <!-- Node 2: Identify Gap -->
  <g data-node="identify-gap">
    <rect x="292" y="120" width="188" height="140" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="324" cy="120" r="16" fill="#08872b"/>
    <text x="324" y="125" class="badge" text-anchor="middle">2</text>
    <!-- Magnifying glass icon -->
    <circle cx="386" cy="164" r="18" fill="none" stroke="#b6bfb8" stroke-width="2"/>
    <circle cx="386" cy="164" r="9" fill="none" stroke="#08872b" stroke-width="2"/>
    <line x1="393" y1="171" x2="402" y2="180" stroke="#08872b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="386" y="210" class="node-label" text-anchor="middle">Identify Gap</text>
    <text x="386" y="230" class="node-sub" text-anchor="middle">What can learners</text>
    <text x="386" y="248" class="node-sub" text-anchor="middle">do after this node?</text>
  </g>

  <!-- Arrow 2→3 -->
  <line x1="482" y1="190" x2="522" y2="190" stroke="#b6bfb8" stroke-width="2.5"/>
  <polygon points="522,184 534,190 522,196" fill="#b6bfb8"/>

  <!-- Node 3: Draft Proposal -->
  <g data-node="draft-proposal">
    <rect x="536" y="120" width="188" height="140" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="568" cy="120" r="16" fill="#08872b"/>
    <text x="568" y="125" class="badge" text-anchor="middle">3</text>
    <!-- Document icon -->
    <rect x="610" y="148" width="32" height="38" rx="3" fill="none" stroke="#b6bfb8" stroke-width="1.5"/>
    <line x1="617" y1="161" x2="635" y2="161" stroke="#08872b" stroke-width="2"/>
    <line x1="617" y1="170" x2="635" y2="170" stroke="#08872b" stroke-width="2"/>
    <line x1="617" y1="179" x2="628" y2="179" stroke="#08872b" stroke-width="2"/>
    <text x="630" y="210" class="node-label" text-anchor="middle">Draft Proposal</text>
    <text x="630" y="230" class="node-sub" text-anchor="middle">Scope + artifacts</text>
    <text x="630" y="248" class="node-sub" text-anchor="middle">list for new node</text>
  </g>

  <!-- Arrow 3→4 -->
  <line x1="726" y1="190" x2="766" y2="190" stroke="#b6bfb8" stroke-width="2.5"/>
  <polygon points="766,184 778,190 766,196" fill="#b6bfb8"/>

  <!-- Node 4: Capture Metadata -->
  <g data-node="capture-metadata">
    <rect x="780" y="120" width="188" height="140" rx="10" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
    <circle cx="812" cy="120" r="16" fill="#08872b"/>
    <text x="812" y="125" class="badge" text-anchor="middle">4</text>
    <!-- Code brackets icon -->
    <text x="874" y="178" class="mono" font-size="28" fill="#b6bfb8" text-anchor="middle">&lt;/&gt;</text>
    <line x1="862" y1="163" x2="858" y2="173" stroke="#08872b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="862" y1="163" x2="858" y2="153" stroke="#08872b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="886" y1="163" x2="890" y2="173" stroke="#08872b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="886" y1="163" x2="890" y2="153" stroke="#08872b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="874" y="210" class="node-label" text-anchor="middle">Add Metadata</text>
    <text x="874" y="230" class="node-sub" text-anchor="middle">XML comments with</text>
    <text x="874" y="248" class="node-sub" text-anchor="middle">sources &amp; rationale</text>
  </g>

  <!-- Arrow 4→5 -->
  <line x1="970" y1="190" x2="1010" y2="190" stroke="#b6bfb8" stroke-width="2.5"/>
  <polygon points="1010,184 1022,190 1010,196" fill="#b6bfb8"/>

  <!-- Node 5: Validate & PR -->
  <g data-node="validate-pr" data-state="open">
    <rect x="1024" y="120" width="140" height="140" rx="10" fill="#0a241b" stroke="#08872b" stroke-width="2"/>
    <circle cx="1056" cy="120" r="16" fill="#08872b"/>
    <text x="1056" y="125" class="badge" text-anchor="middle">5</text>
    <!-- PR icon (git-pull-request shape) -->
    <circle cx="1082" cy="152" r="6" fill="none" stroke="#5fed83" stroke-width="2"/>
    <circle cx="1106" cy="152" r="6" fill="none" stroke="#5fed83" stroke-width="2"/>
    <circle cx="1106" cy="176" r="6" fill="none" stroke="#5fed83" stroke-width="2"/>
    <line x1="1082" y1="158" x2="1082" y2="196" stroke="#5fed83" stroke-width="2"/>
    <path d="M1106 158 Q1106 166 1094 166 L1085 166" fill="none" stroke="#5fed83" stroke-width="2"/>
    <text x="1094" y="220" class="node-label" text-anchor="middle" fill="#f2f5f3">Validate</text>
    <text x="1094" y="238" class="node-sub" text-anchor="middle" fill="#b6bfb8">Lint + compile,</text>
    <text x="1094" y="256" class="node-sub" text-anchor="middle" fill="#b6bfb8">open PR</text>
  </g>

  <!-- Bottom annotation -->
  <text x="600" y="340" class="caption" text-anchor="middle">Each stage builds on the previous: gather evidence → identify what's missing → scope it → trace sources → ship it</text>

  <!-- Divider line -->
  <line x1="48" y1="360" x2="1152" y2="360" stroke="#08872b" stroke-width="3"/>

  <!-- Key / Legend -->
  <rect x="48" y="376" width="22" height="22" rx="3" fill="#ffffff" stroke="#b6bfb8" stroke-width="1.5"/>
  <text x="78" y="392" class="caption">Research or authoring step</text>

  <rect x="280" y="376" width="22" height="22" rx="3" fill="#0a241b" stroke="#08872b" stroke-width="2"/>
  <text x="310" y="392" class="caption">Validation &amp; publish step</text>

  <circle cx="554" cy="387" r="11" fill="#08872b"/>
  <text x="554" y="392" class="badge" text-anchor="middle" font-size="12">N</text>
  <text x="574" y="392" class="caption">Step order badge</text>

</svg>
