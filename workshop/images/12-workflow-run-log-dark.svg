<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Workflow run log">
  <defs>
    <path id="check-circle" d="M8 16A8 8 0 1 1 8 0a8 8 0 0 1 0 16Zm3.78-9.72a.751.751 0 0 0-.018-1.042.751.751 0 0 0-1.042-.018L6.75 9.19 5.28 7.72a.751.751 0 0 0-1.042.018.751.751 0 0 0-.018 1.042l2 2a.75.75 0 0 0 1.06 0Z"/>
  </defs>
  <rect width="1200" height="560" fill="#0d1117"/>

  <!-- Browser chrome -->
  <rect x="0" y="0" width="1200" height="44" rx="8" ry="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <rect x="0" y="22" width="1200" height="22" fill="#161b22"/>
  <rect x="200" y="10" width="800" height="24" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="600" y="26" font-family="Arial,sans-serif" font-size="12" fill="#8b949e" text-anchor="middle">github.com/your-org/your-repo</text>
  <!-- Traffic lights -->
  <circle cx="20" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="22" r="6" fill="#febc2e"/>
  <circle cx="60" cy="22" r="6" fill="#28c840"/>

  <!-- Nav tabs -->
  <rect x="0" y="44" width="1200" height="48" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Code</text>
  <text x="90" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Issues</text>
  <text x="168" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Pull requests</text>
  <text x="309" y="74" font-family="Arial,sans-serif" font-size="14" fill="#58a6ff" font-weight="bold">Actions</text>
  <rect x="309" y="88" width="56" height="3" fill="#58a6ff" rx="2"/>
  <text x="396" y="74" font-family="Arial,sans-serif" font-size="14" fill="#8b949e" font-weight="normal">Settings</text>

  <!-- Log panel dark -->
  <rect x="60" y="105" width="1080" height="410" rx="4" fill="#0d1117"/>
  <text x="80" y="135" font-family="monospace" font-size="13" fill="#8b949e">▼  run-agent  (completed in 42s)</text>
  <line x1="60" y1="148" x2="1140" y2="148" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="175" font-family="monospace" font-size="13" fill="#3fb950">▼  Run gh aw run daily-report-status.md</text>
  <text x="100" y="200" font-family="monospace" font-size="12" fill="#c9d1d9">  Running agent: Daily Report Status Workflow</text>
  <text x="100" y="222" font-family="monospace" font-size="12" fill="#c9d1d9">  Calling tool: list_open_issues</text>
  <text x="100" y="244" font-family="monospace" font-size="12" fill="#c9d1d9">  Found 3 open issues</text>
  <text x="100" y="266" font-family="monospace" font-size="12" fill="#c9d1d9">  Calling tool: get_recent_commits</text>
  <text x="100" y="288" font-family="monospace" font-size="12" fill="#c9d1d9">  Found 5 recent commits</text>
  <text x="100" y="310" font-family="monospace" font-size="12" fill="#c9d1d9">  Generating status report...</text>
  <text x="100" y="332" font-family="monospace" font-size="12" fill="#c9d1d9">  Report written to run summary.</text>
  <use href="#check-circle" fill="#3fb950" transform="translate(80 348) scale(.75)"/>
  <text x="100" y="360" font-family="monospace" font-size="13" fill="#3fb950">Run gh aw run daily-report-status.md  (15s)</text>
  <use href="#check-circle" fill="#3fb950" transform="translate(80 378) scale(.75)"/>
  <text x="100" y="390" font-family="monospace" font-size="13" fill="#3fb950">Complete job</text>
  <use href="#check-circle" fill="#3fb950" transform="translate(80 403) scale(.75)"/>
  <text x="100" y="415" font-family="monospace" font-size="13" fill="#3fb950">Post Set up job</text>
  <text x="600" y="540" font-family="Arial,sans-serif" font-size="24" fill="#8b949e" text-anchor="middle">Workflow run log</text>

</svg>