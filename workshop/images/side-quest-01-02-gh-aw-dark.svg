<text x="108" y="196" text-anchor="start" font-family="monospace" font-size="17" font-weight="400" fill="#7ee787">$ gh aw compile .github/workflows/daily-status.md --validate</text>
<text x="108" y="228" text-anchor="start" font-family="monospace" font-size="17" font-weight="400" fill="#f0f6fc">✓ Frontmatter valid   ✓ Lock file updated</text>
<text x="108" y="264" text-anchor="start" font-family="monospace" font-size="17" font-weight="400" fill="#7ee787">$ gh aw run daily-status</text>
<rect x="84" y="312" width="380" height="134" rx="14" fill="#21153b" stroke="#d2a8ff" stroke-width="1.5"/>
